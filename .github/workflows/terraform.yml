name: Terraform

# Credential-free Terraform CI: proves every root module in the calling repo
# initialises, validates, and (optionally) passes its `terraform test` suite.
#
# There is deliberately no plan or apply job. Plans need Azure credentials and
# only succeed once a configuration's dependencies already exist — components
# and root modules resolve each other with data sources, so a plan against a
# not-yet-applied dependency fails at plan time and reports a CI failure for
# something that is not a defect. Applies are run by hand against remote state.
# Restore a plan job here only alongside an identity that actually holds read
# across the target subscription.

on:
  workflow_call:
    inputs:
      directories:
        description: >-
          JSON array of root-module directories to init and validate, relative
          to the repository root. One matrix leg each.
        type: string
        default: '["terraform"]'
      test-directories:
        description: >-
          JSON array of directories to run `terraform test` in. Empty skips the
          test job entirely. Tests must mock their providers — this workflow
          has no cloud credentials.
        type: string
        default: "[]"
      runs-on:
        description: Runner label for every job.
        type: string
        default: ubuntu-latest
    outputs:
      changed:
        description: >-
          "true" when the event touched Terraform, straight from the path
          filter below. Exposed so a caller that keeps a Terraform job of its
          own — a credentialled plan, which this workflow deliberately does not
          run — can gate it on the same filter instead of declaring a second
          copy that then drifts from this one.
        value: ${{ jobs.changes.outputs.terraform }}

jobs:
  # Path filtering lives here rather than on the caller's workflow trigger so
  # the workflow always runs and the gate job below always reports. A workflow
  # skipped by a top-level paths filter leaves its required check pending
  # forever and blocks the merge.
  changes:
    name: Detect changes
    runs-on: ${{ inputs.runs-on }}
    permissions:
      pull-requests: read
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - name: Detect Terraform changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            terraform:
              - 'terraform/**'
              - '.terraform-version'
              - '.github/workflows/ci-terraform.yml'

  validate:
    name: Validate (${{ matrix.directory }})
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ${{ inputs.runs-on }}
    strategy:
      # Off so each directory reports independently rather than the first
      # failure masking the rest.
      fail-fast: false
      matrix:
        directory: ${{ fromJSON(inputs.directories) }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve Terraform version
        id: tfversion
        run: |
          if [ -f .terraform-version ]; then
            file=.terraform-version
          elif [ -f "$GITHUB_WORKSPACE/.terraform-version" ]; then
            file="$GITHUB_WORKSPACE/.terraform-version"
          else
            echo "::error::No .terraform-version file found in ${{ matrix.directory }} or the repo root"
            exit 1
          fi
          echo "version=$(cat "$file")" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.tfversion.outputs.version }}
          terraform_wrapper: false

      # -backend=false is what keeps this credential-free: it initialises
      # modules and providers without touching the configured backend, so a
      # repo whose backend.tf points at a real remote state account still
      # validates on a fork or a fresh clone with no Azure auth at all.
      - name: Terraform init
        run: terraform init -input=false -backend=false

      - name: Terraform validate
        run: terraform validate -no-color

  # Skipped unless the caller passes directories. The `if` guard matters: an
  # empty matrix vector is a workflow error, so the job must not be created at
  # all when test-directories is the default "[]".
  test:
    name: Test (${{ matrix.directory }})
    needs: changes
    if: needs.changes.outputs.terraform == 'true' && inputs.test-directories != '[]'
    runs-on: ${{ inputs.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        directory: ${{ fromJSON(inputs.test-directories) }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve Terraform version
        id: tfversion
        run: |
          if [ -f .terraform-version ]; then
            file=.terraform-version
          elif [ -f "$GITHUB_WORKSPACE/.terraform-version" ]; then
            file="$GITHUB_WORKSPACE/.terraform-version"
          else
            echo "::error::No .terraform-version file found in ${{ matrix.directory }} or the repo root"
            exit 1
          fi
          echo "version=$(cat "$file")" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.tfversion.outputs.version }}
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false -backend=false

      - name: Terraform test
        run: terraform test -no-color

  # Single always-reporting job for the caller to mark as its required status
  # check. Fails only if validate or test actually failed — skipped (the PR
  # touches no Terraform) counts as success, so non-Terraform PRs are not
  # blocked. The check context the caller must require is
  # "<caller job id> / Terraform".
  terraform:
    name: Terraform
    needs: [validate, test]
    if: always()
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Verify Terraform jobs
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          echo "validate=$VALIDATE_RESULT test=$TEST_RESULT"
          if [ "$VALIDATE_RESULT" = "failure" ] || [ "$TEST_RESULT" = "failure" ]; then
            echo "::error::A Terraform job failed."
            exit 1
          fi
