name: Terraform

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing the Terraform code
        type: string
        default: "."
      environment:
        description: >-
          GitHub environment used for the apply job. Configure it with required
          reviewers to enforce the manual approval gate between plan and apply.
        type: string
        default: ""
      azure-client-id:
        description: Client ID of the Azure app registration / managed identity to authenticate via OIDC
        type: string
        required: true
      azure-tenant-id:
        description: Azure tenant ID
        type: string
        required: true
      azure-subscription-id:
        description: Azure subscription ID
        type: string
        required: true

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Configure Azure credentials
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ inputs.azure-client-id }}
          tenant-id: ${{ inputs.azure-tenant-id }}
          subscription-id: ${{ inputs.azure-subscription-id }}

      - name: Export Azure provider environment
        run: |
          {
            echo "ARM_CLIENT_ID=${{ inputs.azure-client-id }}"
            echo "ARM_TENANT_ID=${{ inputs.azure-tenant-id }}"
            echo "ARM_SUBSCRIPTION_ID=${{ inputs.azure-subscription-id }}"
            echo "ARM_USE_OIDC=true"
          } >> "$GITHUB_ENV"

      - name: Read Terraform version
        id: terraform-version
        run: |
          if [ -f .terraform-version ]; then
            file=.terraform-version
          elif [ -f "$GITHUB_WORKSPACE/.terraform-version" ]; then
            file="$GITHUB_WORKSPACE/.terraform-version"
          else
            echo "::error::No .terraform-version file found in the working directory or the repo root"
            exit 1
          fi
          echo "version=$(cat "$file")" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}

      - name: Terraform Format
        id: fmt
        run: terraform fmt -check -recursive

      - name: Terraform Init
        id: init
        run: terraform init -input=false

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -input=false -out=tfplan

      - name: Upload plan
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tfplan
          path: ${{ inputs.working-directory }}/tfplan
          retention-days: 5

      - name: Comment plan on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
        with:
          script: |
            const marker = '<!-- terraform-plan -->';
            const plan = process.env.PLAN || 'Plan failed - see workflow logs.';
            const truncated = plan.length > 60000 ? plan.slice(0, 60000) + '\n... (truncated)' : plan;
            const body = `${marker}
            #### Terraform \`${{ inputs.working-directory }}\`
            | Step | Result |
            |------|--------|
            | Format | \`${{ steps.fmt.outcome }}\` |
            | Init | \`${{ steps.init.outcome }}\` |
            | Validate | \`${{ steps.validate.outcome }}\` |
            | Plan | \`${{ steps.plan.outcome }}\` |

            <details><summary>Show plan</summary>

            \`\`\`terraform
            ${truncated}
            \`\`\`

            </details>`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  apply:
    name: Apply
    if: github.event_name != 'pull_request'
    needs: plan
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Configure Azure credentials
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ inputs.azure-client-id }}
          tenant-id: ${{ inputs.azure-tenant-id }}
          subscription-id: ${{ inputs.azure-subscription-id }}

      - name: Export Azure provider environment
        run: |
          {
            echo "ARM_CLIENT_ID=${{ inputs.azure-client-id }}"
            echo "ARM_TENANT_ID=${{ inputs.azure-tenant-id }}"
            echo "ARM_SUBSCRIPTION_ID=${{ inputs.azure-subscription-id }}"
            echo "ARM_USE_OIDC=true"
          } >> "$GITHUB_ENV"

      - name: Read Terraform version
        id: terraform-version
        run: |
          if [ -f .terraform-version ]; then
            file=.terraform-version
          elif [ -f "$GITHUB_WORKSPACE/.terraform-version" ]; then
            file="$GITHUB_WORKSPACE/.terraform-version"
          else
            echo "::error::No .terraform-version file found in the working directory or the repo root"
            exit 1
          fi
          echo "version=$(cat "$file")" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}

      - name: Terraform Init
        run: terraform init -input=false

      - name: Download plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tfplan
          path: ${{ inputs.working-directory }}

      - name: Terraform Apply
        run: terraform apply -input=false tfplan
