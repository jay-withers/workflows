name: Pre-commit

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version used to run pre-commit
        type: string
        default: "3.12"
      terraform:
        description: Install the Terraform toolchain (Terraform, TFLint, terraform-docs, Checkov, Node) for Terraform pre-commit hooks
        type: boolean
        default: false
      terraform-version:
        description: Terraform version to install. If empty, read from .terraform-version, falling back to "latest"
        type: string
        default: ""
      node-version:
        description: Node.js version to install when terraform is enabled
        type: string
        default: "24"
      terraform-docs-version:
        description: terraform-docs version to install (without leading v) when terraform is enabled
        type: string
        default: "0.24.0"
      checkov-version:
        description: Checkov version to install when terraform is enabled
        type: string
        default: "3.3.6"
      tflint-config:
        description: Path to the TFLint config used to initialise plugins when terraform is enabled
        type: string
        default: "terraform/.tflint.hcl"

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Setup Node.js
        if: inputs.terraform
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Resolve Terraform version
        id: tfversion
        if: inputs.terraform
        run: |
          if [ -n "${{ inputs.terraform-version }}" ]; then
            version="${{ inputs.terraform-version }}"
          elif [ -f "$GITHUB_WORKSPACE/.terraform-version" ]; then
            version="$(cat "$GITHUB_WORKSPACE/.terraform-version")"
          else
            version="latest"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        if: inputs.terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.tfversion.outputs.version }}
          terraform_wrapper: false

      - name: Setup TFLint
        if: inputs.terraform
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0

      - name: Initialise TFLint plugins
        if: inputs.terraform
        run: |
          if [ -f "${{ inputs.tflint-config }}" ]; then
            tflint --init --config "${{ inputs.tflint-config }}"
          else
            tflint --init
          fi

      - name: Install terraform-docs
        if: inputs.terraform
        env:
          TERRAFORM_DOCS_VERSION: ${{ inputs.terraform-docs-version }}
        run: |
          curl -fsSL "https://github.com/terraform-docs/terraform-docs/releases/download/v${TERRAFORM_DOCS_VERSION}/terraform-docs-v${TERRAFORM_DOCS_VERSION}-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin terraform-docs
          sudo chmod +x /usr/local/bin/terraform-docs

      - name: Install Checkov
        if: inputs.terraform
        run: pip install "checkov==${{ inputs.checkov-version }}"

      - name: Cache pre-commit hooks
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit
        # no-commit-to-branch is a local guard against committing to main; it
        # always fails in CI when checked out on main, so skip it here.
        env:
          SKIP: no-commit-to-branch
        run: pre-commit run --all-files --show-diff-on-failure --color=always
