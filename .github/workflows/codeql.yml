name: CodeQL

# Reusable CodeQL code scanning: static analysis that traces untrusted input
# through the code to where it is used — the injection, path-traversal and
# deserialisation bugs a linter cannot see because they span functions.
#
# Exists because the DAST scanner in jay-withers/security-testing can only
# attack what is reachable without logging in, which for most apps here is a
# login form. CodeQL reads every code path, including everything behind the
# login, on every pull request.
#
# Results land in the repository's Security tab (code scanning alerts) and as
# annotations on the pull request, not as a pass/fail of this job: an analysis
# that ran is green whatever it found. Whether a new alert should block a merge
# is a ruleset decision (code scanning merge protection), made per repository.
on:
  workflow_call:
    inputs:
      languages:
        description: >-
          JSON array of CodeQL languages to analyse, one job each, e.g.
          '["python", "actions"]' or '["go", "actions"]'. Every language is
          analysed without a build except `go`, which CodeQL cannot extract
          without one: it gets `autobuild`, with Go from the caller's mise.toml.
          csharp (and java-kotlin) analyse from source with build-mode none
        type: string
        default: '["python", "actions"]'
      queries:
        description: >-
          Query suite: `security-extended` (default) adds lower-precision
          security queries to CodeQL's own default set; `security-and-quality`
          adds maintainability queries on top. The default suite alone misses
          enough real findings in small codebases that it is not the default here
        type: string
        default: security-extended
      runs-on:
        description: Runner label
        type: string
        default: ubuntu-latest

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ inputs.runs-on }}
    # Deliberately no `permissions` block, as in python.yml: a called workflow
    # can never hold more than its caller, so the caller grants
    # `security-events: write` (to upload results), `contents: read` and
    # `actions: read`. Without security-events: write the upload fails on a 403.
    strategy:
      # One language failing to analyse must not hide another's results.
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Go only: CodeQL extracts Go from a build, so it needs a Go, and the
      # one mise.toml pins (as go.yml uses) rather than whatever the runner
      # image carries. GOTOOLCHAIN=local stops go.mod's `go` line quietly
      # downloading another.
      - name: Setup mise
        if: matrix.language == 'go'
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10

      - name: Put mise's Go first on PATH
        if: matrix.language == 'go'
        run: |
          if ! go="$(mise which go 2>/dev/null)"; then
            echo "::error::Analysing go needs go pinned in mise.toml, e.g. \`mise use go@<version>\`."
            exit 1
          fi
          dirname "$go" >> "$GITHUB_PATH"
          echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"

      - name: Initialise CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          # `none` reads source without building it; Go has no such mode.
          build-mode: ${{ matrix.language == 'go' && 'autobuild' || 'none' }}
          queries: ${{ inputs.queries }}

      # The category keeps each language's results separate in code scanning,
      # so a later run for one language does not close the other's alerts.
      - name: Analyse
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}
