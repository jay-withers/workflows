name: Release

on:
  workflow_call:
    inputs:
      default-bump:
        description: Bump to apply when no conventional commit is found (major, minor, patch or false to skip)
        type: string
        default: "patch"
      release:
        description: Create a GitHub release for the new tag
        type: boolean
        default: true
      update-major-tag:
        description: Move the major tag (e.g. v1) to point at the new release
        type: boolean
        default: false
      dry-run:
        description: Compute the next version without tagging
        type: boolean
        default: false
    outputs:
      tag:
        description: The new tag (e.g. v1.4.2), empty if nothing was tagged
        value: ${{ jobs.tag.outputs.tag }}
      version:
        description: The new version without the v prefix
        value: ${{ jobs.tag.outputs.version }}

jobs:
  tag:
    name: Tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.new_tag }}
      version: ${{ steps.tag.outputs.new_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: ${{ inputs.default-bump }}
          dry_run: ${{ inputs.dry-run }}

      - name: Update major tag
        if: inputs.update-major-tag && !inputs.dry-run && steps.tag.outputs.new_tag != ''
        run: |
          major="v$(echo "${{ steps.tag.outputs.new_version }}" | cut -d. -f1)"
          # The tag action creates the new tag on the remote via the API, so it
          # is not present locally. Point the major tag at the tagged commit.
          git tag -f "$major" "${{ github.sha }}"
          git push -f origin "$major"

      - name: Create GitHub release
        if: inputs.release && !inputs.dry-run && steps.tag.outputs.new_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGELOG: ${{ steps.tag.outputs.changelog }}
        run: |
          gh release create "${{ steps.tag.outputs.new_tag }}" \
            --title "${{ steps.tag.outputs.new_tag }}" \
            --notes "$CHANGELOG"
