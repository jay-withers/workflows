name: Container Apps deploy

# Rolls a published image tag onto a repo's Azure Container Apps workloads by
# running the caller's own `make deploy IMAGE_TAG=<version>`, authenticated to
# Azure with GitHub OIDC.
#
# The make target, not this workflow, knows what to deploy. Every consumer's
# `make deploy` differs: which apps and jobs take the image, which env vars
# ride along (IMAGE_TAG, container URLs read from `terraform output`), and the
# guard against moving tags. Re-implementing that here would make two sources
# of truth for one deploy, and the local `make deploy` would drift from CI.
# So this workflow only supplies what the target needs to run unattended: the
# code at the released tag, Terraform (for `terraform output` against real
# state), and an `az` login.
#
# Like terraform-deploy.yml, the job runs in the GitHub environment named by
# `environment`, reads AZURE_CLIENT_ID / AZURE_TENANT_ID /
# AZURE_SUBSCRIPTION_ID from its variables, and so authenticates with the
# `<repo prefix>:environment:<environment>` subject.
#
# A green `make deploy` only means Azure accepted the new image. The apps scale
# to zero, so a new revision can go live without a container ever starting.
# So when the caller's Makefile has a smoke target, the deploy is proven
# instead: `make deployed-tag` records what is live first, `make smoke` checks
# the new version is the one serving (or, for a job, the one configured), and
# a failed deploy or smoke test rolls back to the recorded tag before failing
# the run. Like the deploy itself, what "healthy" means stays in the caller's
# Makefile. A repo without the target deploys exactly as before.
#
# Every run, whatever its outcome, then writes one row to the platform's
# `Deployments_CL` table (azure-container-apps) through the Logs Ingestion API,
# once the environment carries EVENTS_INGESTION_ENDPOINT and
# EVENTS_DCR_IMMUTABLE_ID (set by github-repos, alongside the Monitoring
# Metrics Publisher grant that lets this identity send). Until then the step
# is skipped with a notice. The Environments page needs nothing extra: a job
# that runs in a GitHub environment already records a deployment there.
#
# Only Renovate's merges deploy themselves. A release whose commit a person
# merged is held: the `gate` job opens a `deploy-pending` issue instead, and
# running the caller by hand (cd-publish's workflow_dispatch) with that tag
# deploys it and closes the issue. Renovate's updates are low-risk and
# frequent, so they don't wait; a person's change goes live when they choose.
# `deploy-on-merge: all` turns the hold off.

on:
  workflow_call:
    inputs:
      version:
        description: >-
          Image tag to deploy, normally the release tag the caller just
          published (e.g. v1.2.3). Also the git ref checked out, so the
          Makefile and Terraform outputs match the release.
        type: string
        required: true
      environment:
        description: >-
          GitHub environment the job runs in, and the `ENV=` passed to make.
        type: string
        default: dev
      target:
        description: Make target to run.
        type: string
        default: deploy
      smoke-target:
        description: >-
          Make target that proves a deployed version works, run after the
          deploy with the same IMAGE_TAG and ENV. Skipped when the caller's
          Makefile has no such target. Empty disables it.
        type: string
        default: smoke
      live-target:
        description: >-
          Make target printing the image tag live before the deploy, as its
          last line of stdout: the version to roll back to. Only run when the
          smoke target exists.
        type: string
        default: deployed-tag
      rollback:
        description: >-
          Redeploy the version that was live when the deploy or smoke test
          fails. The run still fails, so the deploy-failed issue opens.
        type: boolean
        default: true
      client-id:
        description: Overrides the environment's AZURE_CLIENT_ID variable.
        type: string
        default: ""
      tenant-id:
        description: Overrides the environment's AZURE_TENANT_ID variable.
        type: string
        default: ""
      subscription-id:
        description: Overrides the environment's AZURE_SUBSCRIPTION_ID variable.
        type: string
        default: ""
      deploy-on-merge:
        description: >-
          Which merges deploy without a person running the workflow:
          `renovate` (releases whose commit Renovate authored; any other is
          held as a `deploy-pending` issue) or `all`.
        type: string
        default: renovate
      run-workflow:
        description: >-
          The caller's workflow to run by hand to deploy a held release, as the
          `deploy-pending` issue names it. github.workflow can't tell: inside
          a called workflow it is the top-level caller (cd-tag), which takes no
          version.
        type: string
        default: cd-publish
      app:
        description: >-
          Name recorded as `App` in the deploy event. Defaults to the
          repository name; set it where a repo deploys more than one thing
          from separate callers.
        type: string
        default: ""
      verify-images:
        description: >-
          Image references without a tag, whitespace-separated (e.g.
          `ghcr.io/jay-withers/gym-log/gymlog`). Before deploying, each one at
          `version` must carry a build provenance attestation signed by this
          estate's docker.yml for this repository, or the deploy stops before
          anything changes. Empty skips the check. A rollback isn't checked:
          the image it returns to may predate attestations, and it already ran.
        type: string
        default: ""
      runs-on:
        description: Runner label.
        type: string
        default: ubuntu-latest

jobs:
  # Decides whether this run deploys. A run started by hand, or re-run, is
  # someone choosing to deploy, so it always does. A merge deploys only when
  # Renovate authored the released commit, its lock files carry no major
  # update, and nothing is already held: a release carries every commit before
  # it, so a release on top of a held one would ship the held change too, and
  # is held with it. A hold opens
  # (or moves to the newer tag) one `deploy-pending` issue per environment and
  # app. It fails the run if it can't, since a hold nobody hears about would
  # never deploy. Needs `issues: write` and `contents: read`.
  gate:
    name: Gate (${{ inputs.environment }})
    runs-on: ${{ inputs.runs-on }}
    concurrency:
      group: container-apps-deploy-gate-${{ github.repository }}-${{ inputs.environment }}-${{ inputs.app }}
      cancel-in-progress: false
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
      resolves: ${{ steps.gate.outputs.resolves }}
    steps:
      # The same check as the deploy job's, before this job opens any issue.
      - name: Validate trusted deploy context and version ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_VALUE: ${{ github.ref }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "pull_request_target" ]; then
            echo "::error::Deploying is not allowed from pull request events."
            exit 1
          fi

          # Only allow deploying explicit tags (refs/tags/*) or release-like tags (vX.Y.Z...).
          case "$INPUT_VERSION" in
            refs/tags/*) ;;
            v[0-9]*)
              if ! printf '%s' "$INPUT_VERSION" | grep -Eq '^v[0-9]+(\.[0-9]+){1,2}([.-][0-9A-Za-z._-]+)?$'; then
                echo "::error::inputs.version must be a valid release tag."
                exit 1
              fi
              ;;
            *)
              echo "::error::inputs.version must be a tag ref (refs/tags/*) or release tag (v*)."
              exit 1
              ;;
          esac

      # Renovate auto-merges majors, and most Python majors don't even arrive
      # as one: pyproject sets only lower bounds (pydantic>=2.9), so a new
      # major lands inside a "Lock file maintenance" PR that Renovate never
      # calls major. So the lock files decide: a package in any tracked
      # uv.lock whose major version (minor, below 1.0) rose since the
      # previous release holds the deploy, Renovate's or not. Tests and the
      # smoke test still run; this only means a person picks the moment.
      #
      # Only a merge's gate looks: a run by hand deploys regardless. It reads
      # the lock files through the API rather than checking the release out,
      # so no code from the repo ever lands on this runner.
      - name: Find major updates
        id: majors
        if: github.event_name == 'push' && github.run_attempt == 1
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION#refs/tags/}"
          # Any API error fails the step rather than skipping the check: a
          # check that silently passed would deploy what it exists to hold.
          # The release before this one, as release.yml tags them (vX.Y.Z).
          tags="$(gh api "repos/$REPOSITORY/git/matching-refs/tags/v" --paginate --jq '.[].ref | ltrimstr("refs/tags/")')"
          prev="$(printf '%s\n%s\n' "$tags" "$version" | sort -uV | grep -B1 -Fx "$version" | grep -vFx "$version" || true)"
          if [ -z "$prev" ]; then
            echo "No previous release, so nothing to compare."
            exit 0
          fi

          lock_files() {
            gh api "repos/$REPOSITORY/git/trees/$1?recursive=1" \
              --jq '.tree[] | select(.type == "blob" and (.path | test("(^|/)uv\\.lock$"))) | .path'
          }
          locks="$RUNNER_TEMP/locks"
          # A lock file new in this release has nothing to compare against.
          for ref in "$prev" "$version"; do
            files="$(lock_files "$ref")"
            for path in $files; do
              mkdir -p "$locks/$ref/$(dirname "$path")"
              gh api -H "Accept: application/vnd.github.raw" "repos/$REPOSITORY/contents/$path?ref=$ref" > "$locks/$ref/$path"
            done
          done

          # shellcheck disable=SC2016 # Python, not shell
          python3 -c '
          import pathlib, re, sys, tomllib

          old_root, new_root = map(pathlib.Path, sys.argv[1:])

          def key(v):
              # The part of a version whose rise is breaking: 2.x -> (2,), 0.17.x -> (0, 17).
              m = re.match(r"\d+(?:\.\d+)*", v)
              parts = tuple(int(p) for p in m.group().split(".")) if m else (0,)
              return parts[:1] if parts[0] or len(parts) == 1 else parts[:2]

          def versions(path):
              out = {}
              for pkg in tomllib.loads(path.read_text()).get("package", []):
                  src = pkg.get("source", {})
                  if "editable" in src or "virtual" in src or "version" not in pkg:
                      continue  # the project itself
                  v = pkg["version"]
                  if pkg["name"] not in out or key(v) > key(out[pkg["name"]]):
                      out[pkg["name"]] = v
              return out

          for new in sorted(new_root.rglob("uv.lock")):
              path = new.relative_to(new_root)
              if not (old_root / path).exists():
                  continue
              before, after = versions(old_root / path), versions(new)
              for name in sorted(before.keys() & after.keys()):
                  if key(after[name]) > key(before[name]):
                      print(f"- `{name}` {before[name]} → {after[name]} (`{path}`)")
          ' "$locks/$prev" "$locks/$version" > "$RUNNER_TEMP/majors.md"
          if [ -s "$RUNNER_TEMP/majors.md" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Major updates since \`$prev\`:"
            cat "$RUNNER_TEMP/majors.md"
          fi

      - name: Hold or deploy
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          EVENT: ${{ github.event_name }}
          ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW: ${{ inputs.run-workflow }}
          DEPLOY_ON_MERGE: ${{ inputs.deploy-on-merge }}
          INPUT_VERSION: ${{ inputs.version }}
          MAJORS: ${{ steps.majors.outputs.found }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: "Deploy to ${{ inputs.environment }} pending${{ inputs.app && format(' ({0})', inputs.app) || '' }}"
          MARKER: "<!-- deploy-pending:container-apps-deploy:${{ inputs.environment }}:${{ inputs.app }} -->"
        run: |
          case "$DEPLOY_ON_MERGE" in
            renovate|all) ;;
            *) echo "::error::inputs.deploy-on-merge must be 'renovate' or 'all'."; exit 1 ;;
          esac
          version="${INPUT_VERSION#refs/tags/}"
          label=deploy-pending
          # "<number> <held version>" of the open issue, if any.
          existing="$(gh issue list -R "$REPOSITORY" --label "$label" --state open \
            --json number,body --jq ".[] | select(.body | contains(\"$MARKER\"))
              | \"\(.number) \((.body | capture(\"<!-- version:(?<v>[^ ]+) -->\").v) // \"\")\"" | head -1)"
          number="${existing%% *}"
          held="${existing#* }"

          if [ "$EVENT" = "workflow_dispatch" ] || [ "$ATTEMPT" -gt 1 ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            # Deploying the held tag resolves the issue once it succeeds.
            if [ -n "$number" ] && [ "$held" = "$version" ]; then
              echo "resolves=$number" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          author="$(gh api "repos/$REPOSITORY/commits/$version" --jq .commit.author.name)"
          reason=""
          if [ "$DEPLOY_ON_MERGE" != all ]; then
            case "$author" in
              renovate*) ;;
              *) reason="$author merged it, and a person's change goes live when they choose." ;;
            esac
            if [ "$MAJORS" = true ]; then
              reason="${reason:+$reason }It carries major updates, which can break what tests don't cover."
            fi
            if [ -n "$number" ] && [ "$held" != "$version" ]; then
              reason="${reason:+$reason }It includes \`$held\`, held before it, so everything since waits with it."
            fi
          fi
          if [ -z "$reason" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "deploy=false" >> "$GITHUB_OUTPUT"
          body="$RUNNER_TEMP/pending.md"
          {
            echo "$MARKER"
            echo "<!-- version:$version -->"
            echo "@$OWNER \`$version\` is published but not deployed. $reason"
            echo
            if [ "$MAJORS" = true ]; then
              cat "$RUNNER_TEMP/majors.md"
              echo
            fi
            echo "Deploy it by running **$WORKFLOW** from the Actions tab (*Run workflow*) with version \`$version\`. This issue closes itself once that deploy succeeds. Held by: $RUN_URL"
          } > "$body"
          gh label create "$label" -R "$REPOSITORY" --color FBCA04 \
            --description "A release on main waiting to be deployed. Closed by deploying it." 2>/dev/null || true
          if [ -n "$number" ]; then
            gh issue edit "$number" -R "$REPOSITORY" --body-file "$body" > /dev/null
          else
            gh issue create -R "$REPOSITORY" --title "$TITLE" --label "$label" --body-file "$body" > /dev/null
          fi
          echo "Held \`$version\` for a manual deploy. $reason Run **$WORKFLOW** with it to deploy." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy (${{ inputs.environment }})
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ${{ inputs.runs-on }}
    environment: ${{ inputs.environment }}
    # No permissions block, deliberately: the job inherits the caller's grant,
    # which must include `id-token: write` and `contents: read`.
    #
    # One deploy at a time per repo and environment. A newer pending deploy
    # replacing an older one is fine, since it carries a newer release. Never
    # cancel in progress: a half-finished deploy leaves workloads on different
    # images.
    concurrency:
      group: container-apps-deploy-${{ github.repository }}-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ inputs.client-id || vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ inputs.tenant-id || vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ inputs.subscription-id || vars.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "0"
    steps:
      # Audit mode: records every outbound connection this job makes, in the
      # run's StepSecurity insights, without blocking any. The inventory comes
      # first; an allow-list (egress-policy: block) only once it shows what a
      # deploy legitimately reaches.
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Validate trusted deploy context and version ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_VALUE: ${{ github.ref }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "pull_request_target" ]; then
            echo "::error::Deploying is not allowed from pull request events."
            exit 1
          fi

          # Only allow deploying explicit tags (refs/tags/*) or release-like tags (vX.Y.Z...).
          case "$INPUT_VERSION" in
            refs/tags/*) ;;
            v[0-9]*)
              if ! printf '%s' "$INPUT_VERSION" | grep -Eq '^v[0-9]+(\.[0-9]+){1,2}([.-][0-9A-Za-z._-]+)?$'; then
                echo "::error::inputs.version must be a valid release tag."
                exit 1
              fi
              ;;
            *)
              echo "::error::inputs.version must be a tag ref (refs/tags/*) or release tag (v*)."
              exit 1
              ;;
          esac

      # A tag is a pointer anyone with package write can move. Its provenance
      # attestation is signed over the digest by the workflow that built it,
      # so this proves the image about to go live was built by docker.yml from
      # this repository, not pushed by hand or by something else holding a
      # token. The bundle is read from the registry (docker.yml pushes it
      # there), so no extra permission is needed, and the packages are public.
      - name: Verify image provenance
        if: inputs.verify-images != ''
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGES: ${{ inputs.verify-images }}
          INPUT_VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
          SIGNER: ${{ github.repository_owner }}/workflows/.github/workflows/docker.yml
        run: |
          version="${INPUT_VERSION#refs/tags/}"
          failed=0
          while read -r image; do
            [ -n "$image" ] || continue
            echo "::group::$image:$version"
            if gh attestation verify "oci://$image:$version" --bundle-from-oci \
              --repo "$REPOSITORY" --signer-workflow "$SIGNER" \
              --predicate-type https://slsa.dev/provenance/v1; then
              echo "::endgroup::"
              echo "Verified provenance of \`$image:$version\`." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::endgroup::"
              echo "::error::$image:$version has no valid build provenance from $SIGNER for $REPOSITORY."
              failed=1
            fi
          done < <(printf '%s\n' "$IMAGES" | tr -s '[:space:]' '\n')
          exit "$failed"

      - name: Check Azure settings
        env:
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          for v in ARM_CLIENT_ID ARM_TENANT_ID ARM_SUBSCRIPTION_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is empty. Set AZURE_${v#ARM_} as a variable on the '$INPUT_ENVIRONMENT' environment, or pass the matching input."
              exit 1
            fi
          done

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version }}

      - name: Resolve Terraform version
        id: tfversion
        run: |
          for file in .terraform-version terraform/.terraform-version; do
            if [ -f "$file" ]; then
              echo "version=$(cat "$file")" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::No .terraform-version file found in the repo root or terraform/"
          exit 1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.tfversion.outputs.version }}
          terraform_wrapper: false

      - name: Azure login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Check for a smoke test
        id: smoke
        env:
          SMOKE_TARGET: ${{ inputs.smoke-target }}
        run: |
          # `make -n` exits 2 on a missing target and executes no recipe.
          if [ -n "$SMOKE_TARGET" ] && make -n "$SMOKE_TARGET" IMAGE_TAG=probe >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No '$SMOKE_TARGET' make target, so this deploy is not smoke-tested or rolled back."
          fi

      - name: Record the live version
        id: live
        if: steps.smoke.outputs.enabled == 'true'
        env:
          LIVE_TARGET: ${{ inputs.live-target }}
          TF_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          # Not fatal: a first deploy has nothing live to roll back to.
          if out="$(make -s "$LIVE_TARGET" ENV="$TF_ENVIRONMENT")"; then
            # Only a valid image tag counts. On a first deploy the target
            # prints nothing, and the last line would be someone's log output.
            tag="$(printf '%s\n' "$out" | tail -n 1)"
            if ! printf '%s' "$tag" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'; then
              tag=""
            fi
            echo "Live before this deploy: ${tag:-nothing}"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::'make $LIVE_TARGET' failed, so a failed deploy can't be rolled back."
          fi

      - name: Deploy
        id: deploy
        env:
          TARGET: ${{ inputs.target }}
          SMOKE_TARGET: ${{ inputs.smoke-target }}
          SMOKE: ${{ steps.smoke.outputs.enabled }}
          ROLLBACK: ${{ inputs.rollback }}
          PREVIOUS: ${{ steps.live.outputs.tag }}
          VERSION: ${{ inputs.version }}
          TF_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          # SMOKE_PHASE tells the smoke target which kind of deploy it checks. On
          # a rollback it can skip what the old image may predate or what costs
          # time while dev is down (a selfcheck run of each job, say): that
          # image has already run here.
          deploy() {
            make "$TARGET" IMAGE_TAG="$1" ENV="$TF_ENVIRONMENT" || return 1
            [ "$SMOKE" != true ] || SMOKE_PHASE="$2" make "$SMOKE_TARGET" IMAGE_TAG="$1" ENV="$TF_ENVIRONMENT"
          }

          if deploy "$VERSION" release; then
            if [ "$SMOKE" = true ]; then
              echo "result=success" >> "$GITHUB_OUTPUT"
              echo "Deployed and smoke-tested \`$VERSION\` on \`$TF_ENVIRONMENT\`." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "result=untested" >> "$GITHUB_OUTPUT"
              echo "Deployed \`$VERSION\` to \`$TF_ENVIRONMENT\` (no smoke test)." >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi

          echo "::error::Deploying $VERSION to $TF_ENVIRONMENT failed."
          if [ "$SMOKE" != true ] || [ "$ROLLBACK" != true ] || [ -z "$PREVIOUS" ] || [ "$PREVIOUS" = "$VERSION" ]; then
            echo "Deploying \`$VERSION\` to \`$TF_ENVIRONMENT\` failed, with nothing to roll back to." >> "$GITHUB_STEP_SUMMARY"
            echo "outcome=not rolled back" >> "$GITHUB_OUTPUT"
            echo "result=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "::group::Rolling back to $PREVIOUS"
          if deploy "$PREVIOUS" rollback; then
            echo "::endgroup::"
            echo "::error::Rolled back to $PREVIOUS, which passed its smoke test."
            echo "Deploying \`$VERSION\` failed; rolled back to \`$PREVIOUS\`, which is live and healthy." >> "$GITHUB_STEP_SUMMARY"
            echo "outcome=rolled back to \`$PREVIOUS\`, which is live and healthy" >> "$GITHUB_OUTPUT"
            echo "result=rolled_back" >> "$GITHUB_OUTPUT"
          else
            echo "::endgroup::"
            echo "::error::Rolling back to $PREVIOUS failed too. $TF_ENVIRONMENT may be down."
            echo "Deploying \`$VERSION\` failed, and so did rolling back to \`$PREVIOUS\`. \`$TF_ENVIRONMENT\` may be down." >> "$GITHUB_STEP_SUMMARY"
            echo "outcome=rolling back to \`$PREVIOUS\` failed too, so it may be down" >> "$GITHUB_OUTPUT"
            echo "result=failed" >> "$GITHUB_OUTPUT"
          fi
          exit 1

      - name: Close the pending deploy issue
        if: needs.gate.outputs.resolves != '' && (steps.deploy.outputs.result == 'success' || steps.deploy.outputs.result == 'untested')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ needs.gate.outputs.resolves }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VERSION: ${{ inputs.version }}
        run: |
          gh issue close "$NUMBER" -R "$REPOSITORY" --comment "Deployed: $RUN_URL (\`$VERSION\`)" > /dev/null

      # A failed deploy opens an issue, because GitHub emails a failed run only
      # to whoever triggered it, and most of these are triggered by
      # Renovate's auto-merge, so nobody would hear. The issue @-mentions the
      # repo owner. Needs the caller to grant `issues: write`; without it this
      # warns and the job's result is unchanged. Cancelled runs are ignored.
      - name: Report the outcome as an issue
        if: always() && github.event_name != 'pull_request' && job.status != 'cancelled'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          OUTCOME: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WHAT: "Deploy to ${{ inputs.environment }}"
          TITLE: "Deploy to ${{ inputs.environment }} failed"
          MARKER: "<!-- deploy-failed:container-apps-deploy:${{ inputs.environment }} -->"
          REF: ${{ inputs.version }}
          ROLLBACK_OUTCOME: ${{ steps.deploy.outputs.outcome }}
        run: |
          # One open issue per workflow, environment (and directory), found
          # by the hidden marker in its body. A repeat failure comments on it;
          # the next success closes it.
          label=deploy-failed
          existing="$(gh issue list -R "$REPOSITORY" --label "$label" --state open \
            --json number,body --jq ".[] | select(.body | contains(\"$MARKER\")) | .number" | head -1)"
          if [ "$OUTCOME" = "failure" ]; then
            gh label create "$label" -R "$REPOSITORY" --color B60205 \
              --description "A deploy on main failed. Closed by the next success." 2>/dev/null || true
            if [ -n "$existing" ]; then
              gh issue comment "$existing" -R "$REPOSITORY" --body "Failed again: $RUN_URL (\`$REF\`)${ROLLBACK_OUTCOME:+, $ROLLBACK_OUTCOME}" > /dev/null
            else
              body="$(printf '%s\n%s\n\n%s\n\n%s\n' "$MARKER" \
                "@$OWNER $WHAT failed for \`$REF\`${ROLLBACK_OUTCOME:+, and $ROLLBACK_OUTCOME}." \
                "Run: $RUN_URL" \
                "This issue closes itself when the next one succeeds. Re-run the failed run once the cause is fixed.")"
              gh issue create -R "$REPOSITORY" --title "$TITLE" --label "$label" --body "$body" > /dev/null
            fi
          elif [ -n "$existing" ]; then
            gh issue close "$existing" -R "$REPOSITORY" --comment "Recovered: $RUN_URL (\`$REF\`)" > /dev/null
          fi

      # One row in the platform's Deployments_CL per run, success or not, so
      # deploy history is queryable rather than living only in step summaries.
      # Runs last, after the issue step, so a failed post can't change what
      # that step reports about the deploy itself. A failed post fails the
      # job loudly rather than leaving a silent gap in the history: the job
      # is otherwise green, so the red step is the whole signal.
      - name: Record the deploy event
        if: always() && github.event_name != 'pull_request' && job.status != 'cancelled'
        env:
          ENDPOINT: ${{ vars.EVENTS_INGESTION_ENDPOINT }}
          DCR_ID: ${{ vars.EVENTS_DCR_IMMUTABLE_ID }}
          REPOSITORY: ${{ github.repository }}
          APP: ${{ inputs.app }}
          TF_ENVIRONMENT: ${{ inputs.environment }}
          VERSION: ${{ inputs.version }}
          PREVIOUS: ${{ steps.live.outputs.tag }}
          RESULT: ${{ steps.deploy.outputs.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          RESOLVES: ${{ needs.gate.outputs.resolves }}
        run: |
          if [ -z "$ENDPOINT" ] || [ -z "$DCR_ID" ]; then
            echo "::notice::EVENTS_INGESTION_ENDPOINT or EVENTS_DCR_IMMUTABLE_ID is not set on the '$TF_ENVIRONMENT' environment, so this deploy is not recorded."
            exit 0
          fi

          repo="${REPOSITORY#*/}"
          # A deploy step that never ran (Azure login failed, say) left no
          # result: nothing new went live, which is a failed deploy.
          outcome="${RESULT:-failed}"

          # The checkout is the released tag, so HEAD is the commit that went
          # live. Renovate's auto-merges are authored by its bot; anything else
          # was a person. Lead time runs from that commit to now.
          #
          # A run started by hand (cd-publish's workflow_dispatch) redeploys an
          # existing tag: its commit's author didn't trigger it and its commit
          # time says nothing about lead time, so it is a `redeploy` with no
          # lead time rather than skewing either. Unless it deploys a held
          # release (RESOLVES): that is a person's merge going live, `manual`,
          # and the hold counts towards its lead time.
          sha="" trigger="manual" lead=""
          if sha="$(git rev-parse HEAD 2>/dev/null)"; then
            if [ "$EVENT" = "workflow_dispatch" ] && [ -z "$RESOLVES" ]; then
              trigger="redeploy"
            else
              case "$(git log -1 --format=%an)" in
                renovate*) trigger="renovate" ;;
              esac
              lead=$(( $(date +%s) - $(git log -1 --format=%ct) ))
            fi
          fi

          row="$(jq -cn \
            --arg time "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg repo "$repo" \
            --arg app "${APP:-$repo}" \
            --arg env "$TF_ENVIRONMENT" \
            --arg version "$VERSION" \
            --arg previous "$PREVIOUS" \
            --arg outcome "$outcome" \
            --arg trigger "$trigger" \
            --arg sha "$sha" \
            --arg run "$RUN_URL" \
            --arg lead "$lead" \
            '[{TimeGenerated: $time, Repo: $repo, App: $app, Environment: $env,
               Version: $version, PreviousVersion: $previous, Outcome: $outcome,
               Trigger: $trigger, CommitSha: $sha, RunUrl: $run,
               LeadTimeSec: ($lead | if . == "" then null else tonumber end)}]')"
          echo "$row"

          if ! token="$(az account get-access-token --resource https://monitor.azure.com --query accessToken -o tsv)"; then
            echo "::error::No Azure token to record the deploy event with (did Azure login succeed?)."
            exit 1
          fi
          status="$(curl -sS -o /tmp/ingest.out -w '%{http_code}' -X POST \
            "${ENDPOINT%/}/dataCollectionRules/${DCR_ID}/streams/Custom-Deployments_CL?api-version=2023-01-01" \
            -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
            --data "$row")"
          # 204 is the only success: the API accepts the batch whole or not at all.
          if [ "$status" != "204" ]; then
            echo "::error::Recording the deploy event failed with HTTP $status: $(cat /tmp/ingest.out)"
            exit 1
          fi
          echo "Recorded \`$outcome\` for \`$VERSION\` in Deployments_CL." >> "$GITHUB_STEP_SUMMARY"
