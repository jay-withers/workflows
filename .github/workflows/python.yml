name: Python

# Reusable Python CI: run a project's test suite with uv.
#
# Exists because linting is not testing. A repo calling pre-commit.yml gets
# ruff, which proves the code parses and is formatted — not that it works. The
# gap is widest where nobody reads the diff: with Renovate's autoApprove a
# dependency bump reaches main unattended, so a release that breaks a library
# boundary merges green unless something runs the suite.
#
# Deliberately no internal path filter, unlike terraform.yml. A Python suite is
# seconds of runner time where a Terraform matrix is minutes, so filtering buys
# little — and always running sidesteps the trap that file documents, where a
# required check that gets skipped stays pending and blocks the merge.
#
# Two optional gates run inside the same job, so turning one on adds no new
# required check: `typecheck` (a type checker the project pins, e.g. mypy, for
# the None-handling and wrong-type bugs a suite only catches on the paths it
# happens to run) and `diff-coverage` (a floor on how much of the code a pull
# request changes is run by a test). See each input for why it is shaped the
# way it is.
on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory holding pyproject.toml and uv.lock
        type: string
        default: "."
      python-version:
        description: Python version to run the suite on. Match the runtime image rather than the latest release, or a pass here says nothing about what ships
        type: string
        default: "3.12"
      extras:
        description: >-
          Space-separated optional-dependency extras to install. `uv run`
          installs dependency groups but *not* extras, so a project whose
          pytest sits in [project.optional-dependencies] has to name it here —
          otherwise the run fails with a bare "Failed to spawn: pytest"
        type: string
        default: ""
      command:
        description: Command to run under `uv run`
        type: string
        default: pytest
      locked:
        description: Fail if uv.lock is out of date with pyproject.toml, rather than silently resolving around it as a developer's machine would
        type: boolean
        default: true
      coverage:
        description: >-
          Import package to measure coverage of, e.g. "investagent". Empty
          disables coverage entirely. Reported into the job summary. The total
          is never gated: a floor on it fails new changes for old code, and the
          honest response to one is usually to mock out whatever is uncovered
          rather than to test it. `diff-coverage` gates the PR's own lines
        type: string
        default: ""
      coverage-pr-comment:
        description: >-
          Post the coverage table as a single PR comment, updated in place on
          every run. Needs `pull-requests: write` on the *caller* — a reusable
          workflow cannot grant itself more than its caller holds, so without it
          the comment fails on a 403 while the suite still passes
        type: boolean
        default: false
      typecheck:
        description: >-
          Type-check command to run under `uv run` after the suite, e.g. "mypy".
          Empty skips it. The checker comes from the project's own locked dev
          dependencies, never an overlay, so CI and `make typecheck` run the
          same version with the same config
        type: string
        default: ""
      diff-coverage:
        description: >-
          Minimum percentage of the lines a pull request changes in the
          `coverage` package that the suite must run, e.g. "80". Empty gates
          nothing. Needs `coverage`. Only the pull request's own lines count,
          so old untested code never fails a new change, and a pull request
          that changes no measured code passes
        type: string
        default: ""
      postgres:
        description: >-
          Postgres image tag to run for the suite, e.g. "18-alpine". Empty runs
          none. When set, the server is reachable at localhost:5432 and its DSN
          is exported as POSTGRES_TEST_DSN — a test that needs a database
          should skip when that variable is absent, so the suite still runs on
          a clone with no Docker
        type: string
        default: ""
      playwright:
        description: >-
          Install Playwright's Chromium (and the system libraries it needs)
          before the suite, so browser tests run inside this same job and need
          no new required check. Playwright itself comes from the project's own
          locked dependencies (pytest-playwright in its dev extra); the browser
          download is cached per Playwright version. Tests should skip when the
          browser is missing locally but fail under CI, so a broken install
          never passes as skipped
        type: boolean
        default: false
      runs-on:
        description: Runner label
        type: string
        default: ubuntu-latest

jobs:
  test:
    name: Test
    runs-on: ${{ inputs.runs-on }}
    # Deliberately no `permissions` block: the token is whatever the caller
    # grants. A called workflow can never hold more than its caller, so pinning
    # `contents: read` here would make coverage-pr-comment's
    # `pull-requests: write` unobtainable no matter what the caller does — the
    # comment would 403 on every run and only ever log its warning.
    #
    # The cost is that a caller with no `permissions` block of its own passes
    # down the repository default rather than a read-only token, so callers
    # should set one. Every example in the README does.
    steps:
      # First, so a misconfigured caller hears in seconds rather than after
      # the toolchain install and a Postgres start.
      - name: Check inputs
        if: ${{ inputs.diff-coverage != '' }}
        env:
          COVERAGE: ${{ inputs.coverage }}
          DIFF_COVERAGE: ${{ inputs.diff-coverage }}
        run: |
          if [ -z "$COVERAGE" ]; then
            echo "::error::diff-coverage needs coverage set to the import package to measure."
            exit 1
          fi
          if ! [[ "$DIFF_COVERAGE" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::diff-coverage must be a plain number such as 80, not '$DIFF_COVERAGE'."
            exit 1
          fi

      # Depth 2 on a pull request: the checkout is the merge commit, and its
      # first parent is the base branch as merged against, which is what
      # diff-coverage diffs against. One extra commit rather than the whole
      # history, and the base can't move between checkout and diff.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}

      # A repo with a mise.toml at its root gets every tool from it, at the
      # versions (and, with a mise.lock, the checksums) it pins; the setup
      # steps below are only for repos that have not moved yet. See
      # "Toolchain from mise" in the README.
      - name: Detect mise.toml
        id: mise
        run: |
          if [ -f "$GITHUB_WORKSPACE/mise.toml" ] || [ -f "$GITHUB_WORKSPACE/.mise.toml" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup mise
        if: steps.mise.outputs.enabled == 'true'
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          working_directory: ${{ github.workspace }}

      - name: Setup uv
        if: steps.mise.outputs.enabled != 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ inputs.python-version }}
          enable-cache: true
          cache-dependency-glob: ${{ inputs.working-directory }}/uv.lock

      # uv would otherwise pick whichever interpreter it finds first, or
      # download its own; point it at the one mise.toml pins, if any.
      - name: Check uv comes from mise
        if: steps.mise.outputs.enabled == 'true'
        run: |
          if ! command -v uv >/dev/null; then
            echo "::error::mise.toml has no uv. Add it, e.g. \`mise use uv@<version>\`."
            exit 1
          fi
          uv --version
          if python="$(mise which python 2>/dev/null)"; then
            echo "UV_PYTHON=$python" >> "$GITHUB_ENV"
            "$python" --version
          fi

      # `docker run` rather than a `services:` block, which cannot be made
      # conditional: a service with an empty image is a workflow error, so
      # declaring one unconditionally would impose Postgres on every caller.
      # A step, unlike a service, can simply be skipped.
      - name: Start Postgres
        if: ${{ inputs.postgres != '' }}
        env:
          IMAGE: postgres:${{ inputs.postgres }}
        run: |
          docker run -d --name ci-postgres \
            -e POSTGRES_PASSWORD=postgres \
            -p 5432:5432 "$IMAGE"
          # Poll rather than trust a fixed sleep: initdb's duration varies with
          # the runner, and a suite that connects too early fails in a way that
          # reads like a broken test.
          for _ in $(seq 1 60); do
            if docker exec ci-postgres pg_isready -U postgres -q; then
              echo "POSTGRES_TEST_DSN=postgresql://postgres:postgres@localhost:5432/postgres" \
                >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Postgres did not become ready within 60s"
          docker logs ci-postgres >&2
          exit 1

      # Keyed on the Playwright version the project locks, because each release
      # pins its own browser build: a cache from another version is a miss
      # that `playwright install` would download over anyway.
      - name: Detect Playwright version
        id: playwright
        if: ${{ inputs.playwright }}
        working-directory: ${{ inputs.working-directory }}
        env:
          EXTRAS: ${{ inputs.extras }}
          LOCKED: ${{ inputs.locked }}
        run: |
          args=()
          if [ "$LOCKED" = "true" ]; then
            args+=(--locked)
          fi
          for extra in $EXTRAS; do
            args+=(--extra "$extra")
          done
          version="$(uv run "${args[@]}" python -c \
            'import importlib.metadata as m; print(m.version("playwright"))')" || {
            echo "::error::playwright: true, but the project's environment has no playwright. Add pytest-playwright to the extra named in extras."
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: ${{ inputs.playwright }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      # --with-deps on every run, cache hit or not: the cache holds the browser,
      # not the apt packages it links against (libnss3, libasound2...), and a
      # fresh runner has neither. With the browser cached this is the apt step
      # alone.
      - name: Install Playwright Chromium
        if: ${{ inputs.playwright }}
        working-directory: ${{ inputs.working-directory }}
        env:
          EXTRAS: ${{ inputs.extras }}
          LOCKED: ${{ inputs.locked }}
        run: |
          args=()
          if [ "$LOCKED" = "true" ]; then
            args+=(--locked)
          fi
          for extra in $EXTRAS; do
            args+=(--extra "$extra")
          done
          uv run "${args[@]}" playwright install --with-deps chromium

      - name: Run ${{ inputs.command }}
        id: suite
        working-directory: ${{ inputs.working-directory }}
        env:
          # Through the environment rather than interpolated into the script:
          # an input expanded directly into `run` is executed by the shell.
          EXTRAS: ${{ inputs.extras }}
          LOCKED: ${{ inputs.locked }}
          COMMAND: ${{ inputs.command }}
          COVERAGE: ${{ inputs.coverage }}
          DIFF_COVERAGE: ${{ inputs.diff-coverage }}
        run: |
          args=()
          if [ "$LOCKED" = "true" ]; then
            args+=(--locked)
          fi
          for extra in $EXTRAS; do
            args+=(--extra "$extra")
          done
          read -ra command <<< "$COMMAND"
          # pytest-cov comes in through --with rather than being expected in the
          # project's dev extra. It is an ephemeral overlay, so a consuming repo
          # needs no coverage dependency and no lockfile churn to turn this on,
          # and --with does not invalidate the --locked assertion above.
          #
          # Appended to `command` rather than folded into the `command` input so
          # the override stays free for its own purpose: a repo passing
          # `command: pytest -x` must not silently lose its coverage, and one
          # passing `python -m unittest` must not be handed flags it cannot
          # parse.
          if [ -n "$COVERAGE" ]; then
            args+=(--with pytest-cov)
            command+=(--cov="$COVERAGE" --cov-report=term-missing)
            # diff-cover reads Cobertura XML; the terminal report stays as is.
            if [ -n "$DIFF_COVERAGE" ]; then
              command+=(--cov-report=xml)
            fi
          fi
          uv run "${args[@]}" "${command[@]}"

      # Runs when the suite ran, pass or fail: a failing test and a type error
      # are separate news, and one run should report both rather than make the
      # author push twice to find the second. Not after a setup failure, which
      # would only fail again here with the same cause.
      - name: Type check
        if: ${{ !cancelled() && inputs.typecheck != '' && (steps.suite.outcome == 'success' || steps.suite.outcome == 'failure') }}
        working-directory: ${{ inputs.working-directory }}
        env:
          EXTRAS: ${{ inputs.extras }}
          LOCKED: ${{ inputs.locked }}
          TYPECHECK: ${{ inputs.typecheck }}
        run: |
          args=()
          if [ "$LOCKED" = "true" ]; then
            args+=(--locked)
          fi
          for extra in $EXTRAS; do
            args+=(--extra "$extra")
          done
          read -ra command <<< "$TYPECHECK"
          uv run "${args[@]}" "${command[@]}"

      # always(), because a failing suite is exactly when the reader wants to
      # know what the tests did reach. Guarded on the data file because a run
      # that died during collection never wrote one, and `coverage report`
      # would then fail the job over a report about nothing.
      - name: Report coverage
        if: ${{ always() && inputs.coverage != '' }}
        working-directory: ${{ inputs.working-directory }}
        run: |
          if [ ! -f .coverage ]; then
            echo "No coverage data was written — skipping the report." >&2
            exit 0
          fi
          # --format=markdown renders the same table as the terminal report,
          # which is what makes it usable in both a job summary and a comment.
          uv run --with pytest-cov coverage report --format=markdown > coverage.md
          {
            echo "## Coverage"
            echo
            cat coverage.md
          } >> "$GITHUB_STEP_SUMMARY"

      # Gates on the pull request's own lines only. A floor on total coverage
      # fails a new change for old code it never touched, and is cheapest to
      # meet by mocking whatever is uncovered; on the diff, the cheapest way is
      # usually to test the code just written. Only after a passing suite: a
      # failed test leaves coverage that measures nothing.
      #
      # Compared with HEAD^1, the merge commit's base-branch parent (checked
      # out at depth 2 above). diff-cover runs as a uv tool, outside the project
      # environment it never imports, and is pinned, unlike the pytest-cov
      # overlay, because its arithmetic decides a required check. A regex
      # manager in renovate.json keeps the pin current. Its report is
      # appended to coverage.md, so the job summary and the PR comment (the
      # next step) show which changed lines no test runs.
      - name: Diff coverage
        if: ${{ !cancelled() && steps.suite.outcome == 'success' && inputs.diff-coverage != '' && github.event_name == 'pull_request' }}
        working-directory: ${{ inputs.working-directory }}
        env:
          DIFF_COVERAGE: ${{ inputs.diff-coverage }}
        run: |
          if [ ! -f coverage.xml ]; then
            echo "::error::No coverage.xml in ${PWD}. If [tool.coverage.xml] output moves it, drop that setting; diff-coverage reads the default."
            exit 1
          fi
          status=0
          uv tool run diff-cover@11.0.4 coverage.xml \
            --compare-branch=HEAD^1 --fail-under="$DIFF_COVERAGE" \
            --format markdown:diff-coverage.md || status=$?
          if [ ! -f diff-coverage.md ]; then
            echo "::error::diff-cover failed before writing a report (exit $status). Its log above has the cause; this is not a coverage result."
            exit 1
          fi
          # diff-cover writes its own "# Diff Coverage" heading.
          cat diff-coverage.md >> "$GITHUB_STEP_SUMMARY"
          { echo; cat diff-coverage.md; } >> coverage.md
          if [ "$status" -ne 0 ]; then
            echo "::error::Under $DIFF_COVERAGE% of the lines this pull request changes are run by a test. The summary lists them."
          fi
          exit "$status"

      # A single comment kept up to date, rather than one per push: a PR with
      # twenty commits should carry one coverage table, not twenty. Matched on
      # an HTML marker, which survives the body being edited and is invisible in
      # the rendered comment.
      - name: Comment coverage on the pull request
        if: ${{ always() && inputs.coverage != '' && inputs['coverage-pr-comment'] && github.event_name == 'pull_request' }}
        working-directory: ${{ inputs.working-directory }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
          REPO: ${{ github.repository }}
        run: |
          [ -f coverage.md ] || exit 0
          marker='<!-- jay-withers/workflows: coverage -->'
          printf '%s\n## Coverage\n\n' "$marker" > comment.md
          cat coverage.md >> comment.md
          existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq "map(select(.body | startswith(\"$marker\")))[0].id // empty")
          # Never fatal. The token is read-only on a fork's pull request and on
          # any caller that did not grant pull-requests: write, and a suite that
          # passed must not be reported as failed because a comment did not
          # post. The warning is the signal that the permission is missing.
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@comment.md >/dev/null \
              || echo "::warning::Could not update the coverage comment (needs pull-requests: write on the caller)."
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@comment.md >/dev/null \
              || echo "::warning::Could not post the coverage comment (needs pull-requests: write on the caller)."
          fi
