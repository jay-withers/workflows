name: Terraform deploy

# Credentialled plan, and optionally apply, of one root module against one
# environment, authenticating to Azure with GitHub OIDC.
#
# One workflow rather than a plan one and an apply one, for the same reason as
# docker.yml: a PR, a merge and a manual apply all run the same init and plan,
# differing only in `apply` and in where the result goes (a PR comment, a
# `terraform-pending` issue, or the apply itself), so a green plan on the PR
# proves the plan the apply will run.
#
# Apply runs the saved plan from the same job, never a fresh plan, so what is
# applied is exactly what was printed above it. It is skipped when the plan has
# no changes.
#
# The job runs in the GitHub environment named by `environment`, for two
# reasons. The Azure identity's details live there as environment variables
# (AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID), which only a job
# in that environment can read. And the OIDC token's subject becomes
# `<repo prefix>:environment:<environment>` for plans and applies alike, so one
# federated credential per environment covers both.
#
# A configuration that also uses the github provider (github-repos) reads its
# token from the TF_GITHUB_TOKEN secret on that same environment, never a
# repository secret: a repository secret reaches a workflow run from any
# branch, an environment secret only the jobs its branch rules let in. The
# cloudflare provider (cloudflare) reads CLOUDFLARE_API_TOKEN the same way.
# Either secret left unset is empty, and a configuration without that
# provider never reads it.
#
# `drift: true` is the nightly drift check: the same plan, but its result is
# recorded instead of acted on. It never applies and never opens or closes a
# `terraform-pending` issue; it writes one `OpsEvents_CL` row (Kind `drift`,
# Status `ok`, `drifted`, `pending` or `failed`) through the Logs Ingestion API,
# and the platform's alert on that table is what tells someone. `pending` is a
# plan with changes while this directory and environment's `terraform-pending`
# issue is open: a merged change waiting to be applied, which that issue
# already reports, so the alert leaves it alone.
#
# This is deliberately separate from terraform.yml, which stays credential-free:
# a plan needs an identity with read on everything the configuration touches
# and only succeeds once its dependencies exist, so only repos that meet both
# call this.

on:
  workflow_call:
    inputs:
      environment:
        description: >-
          Environment name. The job runs in the GitHub environment of this
          name, and it picks `backends/<environment>.hcl` and
          `environments/<environment>.tfvars` inside `directory`.
        type: string
        default: dev
      github-environment:
        description: >-
          GitHub environment the job runs in, when it differs from
          `environment`: a configuration whose plans and applies log in as
          different identities runs each in its own GitHub environment. Empty
          uses `environment`.
        type: string
        default: ""
      environment-files:
        description: >-
          Pass `backends/<environment>.hcl` and
          `environments/<environment>.tfvars`. False for a root with a single
          deployment, whose backend block and terraform.tfvars are complete on
          their own.
        type: boolean
        default: true
      directory:
        description: Root-module directory, relative to the repository root.
        type: string
        default: terraform
      apply:
        description: >-
          Apply the saved plan when it has changes. Refused on a pull_request
          event — a PR must never change real infrastructure. When false on a
          push, a plan with changes opens a `terraform-pending` issue instead,
          which closes once a later run applies them or finds none.
        type: boolean
        default: false
      drift:
        description: >-
          Drift check: plan only, record the result as an `OpsEvents_CL` row
          (needs the environment's EVENTS_INGESTION_ENDPOINT and
          EVENTS_DCR_IMMUTABLE_ID), and leave `terraform-pending` issues alone.
          Refused together with `apply`.
        type: boolean
        default: false
      client-id:
        description: >-
          Overrides the environment's AZURE_CLIENT_ID variable. Leave empty to
          use it. Whichever is used, the identity's federated credential must
          trust `<repo prefix>:environment:<environment>`.
        type: string
        default: ""
      tenant-id:
        description: Overrides the environment's AZURE_TENANT_ID variable.
        type: string
        default: ""
      subscription-id:
        description: Overrides the environment's AZURE_SUBSCRIPTION_ID variable.
        type: string
        default: ""
      runs-on:
        description: Runner label.
        type: string
        default: ubuntu-latest
    # No `secrets:` block, deliberately: declaring TF_GITHUB_TOKEN here made
    # `secrets.` resolve to the caller's (empty) value. The caller must still
    # pass `secrets: inherit`, or the called job sees no secrets at all, its
    # own environment's included.
    outputs:
      has-changes:
        description: '"true" when the plan had changes.'
        value: ${{ jobs.deploy.outputs.has-changes }}

jobs:
  deploy:
    name: ${{ inputs.apply && 'Apply' || inputs.drift && 'Drift' || 'Plan' }} (${{ inputs.environment }})
    runs-on: ${{ inputs.runs-on }}
    environment: ${{ inputs.github-environment || inputs.environment }}
    # No permissions block, deliberately: the job inherits the caller's grant.
    # A PR caller grants `pull-requests: write` for the plan comment and an
    # apply caller doesn't, and a job that *requested* it here would refuse to
    # start for any caller that didn't grant it.
    #
    # Applies share one group per directory and environment; a newer pending
    # apply replacing an older one is fine, since the newer commit on main
    # contains the older one. Plans are grouped by ref, so a push to one PR
    # can't replace another PR's pending plan, or a pending apply. Overlapping
    # plans and applies wait on the state lock instead. A drift check has its
    # own group, so a nightly run never replaces a pending plan on main.
    # Never cancel in progress: killing an apply mid-run leaves state locked.
    concurrency:
      group: terraform-deploy-${{ github.repository }}-${{ inputs.directory }}-${{ inputs.environment }}-${{ inputs.apply && 'apply' || inputs.drift && 'drift' || github.ref }}
      cancel-in-progress: false
    outputs:
      has-changes: ${{ steps.plan.outputs.has-changes }}
    defaults:
      run:
        working-directory: ${{ inputs.directory }}
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ inputs.client-id || vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ inputs.tenant-id || vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ inputs.subscription-id || vars.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: "true"
    steps:
      # Audit mode, as in container-apps-deploy.yml: an inventory of where this
      # job connects, which github-repos' apply runs with Owner-level rights.
      # Blocking comes later, from that inventory.
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Refuse to apply from a pull request
        if: inputs.apply && github.event_name == 'pull_request'
        working-directory: .
        run: |
          echo "::error::apply: true is not allowed on a pull_request event."
          exit 1

      - name: Refuse to apply from a drift check
        if: inputs.apply && inputs.drift
        working-directory: .
        run: |
          echo "::error::apply: true and drift: true are mutually exclusive."
          exit 1

      - name: Check Azure settings
        working-directory: .
        env:
          INPUT_ENVIRONMENT: ${{ inputs.github-environment || inputs.environment }}
        run: |
          for v in ARM_CLIENT_ID ARM_TENANT_ID ARM_SUBSCRIPTION_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is empty. Set AZURE_${v#ARM_} as a variable on the '$INPUT_ENVIRONMENT' environment, or pass the matching input."
              exit 1
            fi
          done

      # Every TF_VAR_* Actions variable (environment, repository or owner)
      # becomes a Terraform input, so values that identify a person or a
      # subscription live in GitHub rather than in a committed tfvars file.
      # GitHub stores variable names upper-cased and Terraform matches
      # TF_VAR_<name> case-sensitively, so the part after the prefix is
      # lower-cased. A variable the configuration doesn't declare is ignored.
      - name: Export TF_VAR_* variables
        working-directory: .
        env:
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          jq -r 'to_entries[] | select(.key | startswith("TF_VAR_")) | .key' <<<"$VARS_JSON" |
            while read -r key; do
              name="TF_VAR_$(tr '[:upper:]' '[:lower:]' <<<"${key#TF_VAR_}")"
              delimiter="EOF_$(openssl rand -hex 16)"
              {
                echo "$name<<$delimiter"
                jq -r --arg k "$key" '.[$k]' <<<"$VARS_JSON"
                echo "$delimiter"
              } >> "$GITHUB_ENV"
              echo "Exported $name"
            done

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve Terraform version
        id: tfversion
        env:
          INPUT_DIRECTORY: ${{ inputs.directory }}
        run: |
          if [ -f .terraform-version ]; then
            file=.terraform-version
          elif [ -f "$GITHUB_WORKSPACE/.terraform-version" ]; then
            file="$GITHUB_WORKSPACE/.terraform-version"
          else
            echo "::error::No .terraform-version file found in $INPUT_DIRECTORY or the repo root"
            exit 1
          fi
          echo "version=$(cat "$file")" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.tfversion.outputs.version }}
          terraform_wrapper: false

      - name: Terraform init
        env:
          TF_ENVIRONMENT: ${{ inputs.environment }}
          ENVIRONMENT_FILES: ${{ inputs.environment-files }}
        run: |
          if [ "$ENVIRONMENT_FILES" = "true" ]; then
            terraform init -input=false -backend-config="backends/${TF_ENVIRONMENT}.hcl"
          else
            terraform init -input=false
          fi

      # -detailed-exitcode: 0 is no changes, 2 is changes, 1 is an error. The
      # lock timeout covers a PR plan overlapping an apply on main.
      - name: Terraform plan
        id: plan
        env:
          TF_ENVIRONMENT: ${{ inputs.environment }}
          ENVIRONMENT_FILES: ${{ inputs.environment-files }}
          GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          var_file=()
          if [ "$ENVIRONMENT_FILES" = "true" ]; then
            var_file=(-var-file="environments/${TF_ENVIRONMENT}.tfvars")
          fi
          set +e
          terraform plan -input=false -no-color -lock-timeout=5m \
            "${var_file[@]}" \
            -out=tfplan -detailed-exitcode
          code=$?
          set -e
          case "$code" in
            0) echo "has-changes=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "has-changes=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$code" ;;
          esac

      # Deletes and replaces are the changes to read twice, so they are listed
      # on their own in the PR comment, the summary and any pending issue. A
      # replace is delete + create, so both show up here.
      - name: List destroys
        id: destroys
        if: steps.plan.outputs.has-changes == 'true'
        run: |
          list="$RUNNER_TEMP/destroys.txt"
          terraform show -json tfplan \
            | jq -r '.resource_changes[]? | select(.change.actions | index("delete"))
                     | "\(.address) (\(if (.change.actions | index("create")) then "replace" else "delete" end))"' \
            > "$list"
          echo "count=$(wc -l < "$list" | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "list=$list" >> "$GITHUB_OUTPUT"
          while read -r line; do echo "::warning::Plan deletes $line"; done < "$list"

      # One rendering for both the job summary and the PR comment. 60,000
      # bytes keeps the comment under GitHub's 65,536-character limit with
      # room for the wrapper; the full plan is always in the job log above.
      - name: Render plan
        id: render
        env:
          HAS_CHANGES: ${{ steps.plan.outputs.has-changes }}
          DESTROY_COUNT: ${{ steps.destroys.outputs.count }}
          DESTROY_LIST: ${{ steps.destroys.outputs.list }}
          TITLE: "Terraform plan: `${{ inputs.directory }}` (${{ inputs.environment }})"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # On a PR, github.sha is the merge commit, which isn't on the branch.
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          body="$RUNNER_TEMP/plan.md"
          {
            echo "### $TITLE"
            echo
            if [ "$HAS_CHANGES" = "true" ]; then
              terraform show -no-color tfplan > "$RUNNER_TEMP/plan.txt"
              grep -E '^Plan:|^Changes to Outputs:' "$RUNNER_TEMP/plan.txt" | head -1 | sed 's/^/**/; s/$/**/'
              echo
              if [ "${DESTROY_COUNT:-0}" -gt 0 ]; then
                echo "> [!CAUTION]"
                echo "> **Deletes or replaces $DESTROY_COUNT resource(s):**"
                echo ">"
                # Literal backticks: Markdown code spans, not expansions.
                # shellcheck disable=SC2016
                sed 's/^/> - `/; s/ (/` (/' "$DESTROY_LIST"
                echo
              fi
              echo '<details><summary>Show plan</summary>'
              echo
              echo '```hcl'
              head -c 60000 "$RUNNER_TEMP/plan.txt"
              if [ "$(wc -c < "$RUNNER_TEMP/plan.txt")" -gt 60000 ]; then
                echo
                echo "... truncated, see the run for the full plan"
              fi
              echo '```'
              echo '</details>'
            else
              echo "**No changes.** Infrastructure matches the configuration."
            fi
            echo
            echo "[Run]($RUN_URL) · \`${SHA:0:7}\`"
          } > "$body"
          cat "$body" >> "$GITHUB_STEP_SUMMARY"
          echo "body=$body" >> "$GITHUB_OUTPUT"

      # One comment per directory and environment, edited in place on every
      # push, found by the hidden marker on its first line. Needs the caller
      # to grant `pull-requests: write`.
      - name: Comment plan on the PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BODY_FILE: ${{ steps.render.outputs.body }}
          MARKER: "<!-- terraform-deploy:${{ inputs.directory }}:${{ inputs.environment }} -->"
          REPOSITORY: ${{ github.repository }}
          COMMENTS_URL: repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments
        run: |
          body="$(printf '%s\n%s' "$MARKER" "$(cat "$BODY_FILE")")"
          id="$(gh api --paginate "$COMMENTS_URL" \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$MARKER\")))][0].id // empty" | head -1)"
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api --method POST "$COMMENTS_URL" -f body="$body" > /dev/null
          fi

      - name: Terraform apply
        if: inputs.apply && steps.plan.outputs.has-changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: terraform apply -input=false -no-color tfplan

      # Infrastructure changes are applied by a human, not by a merge: the
      # caller's push runs plan with `apply: false`, and a plan with changes
      # becomes a `terraform-pending` issue (the creation emails the owner;
      # repo-agent's weekly digest lists the open ones). Running the caller by
      # hand with `apply: true` applies them, and that run, or any later plan
      # with no changes, closes the issue. Later merges only refresh the body,
      # so the issue doesn't email on every merge. Needs `issues: write`;
      # without it this warns and the job's result is unchanged.
      - name: Track pending changes
        if: always() && github.event_name != 'pull_request' && !inputs.drift && job.status == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          APPLY: ${{ inputs.apply }}
          HAS_CHANGES: ${{ steps.plan.outputs.has-changes }}
          DESTROY_COUNT: ${{ steps.destroys.outputs.count }}
          DESTROY_LIST: ${{ steps.destroys.outputs.list }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: "Terraform changes pending apply to ${{ inputs.environment }} (${{ inputs.directory }})"
          MARKER: "<!-- terraform-pending:${{ inputs.directory }}:${{ inputs.environment }} -->"
          REF: ${{ github.sha }}
        run: |
          label=terraform-pending
          existing="$(gh issue list -R "$REPOSITORY" --label "$label" --state open \
            --json number,body --jq ".[] | select(.body | contains(\"$MARKER\")) | .number" | head -1)"

          if [ "$HAS_CHANGES" = "true" ] && [ "$APPLY" != "true" ]; then
            summary="$(grep -E '^Plan:|^Changes to Outputs:' "$RUNNER_TEMP/plan.txt" | head -1)"
            body="$RUNNER_TEMP/pending.md"
            {
              echo "$MARKER"
              echo "@$OWNER \`main\` has Terraform changes that haven't been applied."
              echo
              echo "**$summary** (as of \`${REF:0:7}\`)"
              echo
              if [ "${DESTROY_COUNT:-0}" -gt 0 ]; then
                echo "> [!CAUTION]"
                echo "> **Deletes or replaces $DESTROY_COUNT resource(s):**"
                echo ">"
                # Literal backticks: Markdown code spans, not expansions.
                # shellcheck disable=SC2016
                sed 's/^/> - `/; s/ (/` (/' "$DESTROY_LIST"
                echo
              fi
              echo "Review the plan in the [latest run]($RUN_URL), then apply it by running **${GITHUB_WORKFLOW}** from the Actions tab (*Run workflow*). This issue closes itself once nothing is left to apply."
            } > "$body"
            gh label create "$label" -R "$REPOSITORY" --color 0E8A16 \
              --description "Terraform changes on main waiting to be applied. Closed by the next apply." 2>/dev/null || true
            if [ -n "$existing" ]; then
              gh issue edit "$existing" -R "$REPOSITORY" --body-file "$body" > /dev/null
            else
              gh issue create -R "$REPOSITORY" --title "$TITLE" --label "$label" --body-file "$body" > /dev/null
            fi
          elif [ -n "$existing" ]; then
            if [ "$HAS_CHANGES" = "true" ]; then why="Applied"; else why="Nothing left to apply"; fi
            gh issue close "$existing" -R "$REPOSITORY" --comment "$why: $RUN_URL (\`${REF:0:7}\`)" > /dev/null
          fi

      # Also runs on a plan-only push whose plan is clean: main and the
      # environment then agree, so an open "apply failed" issue is stale and is
      # closed, rather than waiting for a manual apply with nothing to do.
      #
      # A failed apply on main opens an issue, because GitHub emails a failed run
      # only to whoever triggered it, and most of these are triggered by
      # Renovate's auto-merge, so nobody would hear. The issue @-mentions the
      # repo owner. Needs the caller to grant `issues: write`; without it this
      # warns and the job's result is unchanged. Cancelled runs are ignored.
      - name: Report the outcome as an issue
        if: always() && github.event_name != 'pull_request' && job.status != 'cancelled' && (inputs.apply || steps.plan.outputs.has-changes == 'false')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          OUTCOME: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WHAT: "Terraform apply of `${{ inputs.directory }}` to ${{ inputs.environment }}"
          TITLE: "Terraform apply to ${{ inputs.environment }} failed (${{ inputs.directory }})"
          MARKER: "<!-- deploy-failed:terraform-deploy:${{ inputs.directory }}:${{ inputs.environment }} -->"
          REF: ${{ github.sha }}
        run: |
          # One open issue per workflow, environment (and directory), found
          # by the hidden marker in its body. A repeat failure comments on it;
          # the next success closes it.
          label=deploy-failed
          existing="$(gh issue list -R "$REPOSITORY" --label "$label" --state open \
            --json number,body --jq ".[] | select(.body | contains(\"$MARKER\")) | .number" | head -1)"
          if [ "$OUTCOME" = "failure" ]; then
            gh label create "$label" -R "$REPOSITORY" --color B60205 \
              --description "A deploy on main failed. Closed by the next success." 2>/dev/null || true
            if [ -n "$existing" ]; then
              gh issue comment "$existing" -R "$REPOSITORY" --body "Failed again: $RUN_URL (\`$REF\`)" > /dev/null
            else
              body="$(printf '%s\n%s\n\n%s\n\n%s\n' "$MARKER" \
                "@$OWNER $WHAT failed for \`$REF\`." \
                "Run: $RUN_URL" \
                "This issue closes itself when the next one succeeds. Re-run the failed run once the cause is fixed.")"
              gh issue create -R "$REPOSITORY" --title "$TITLE" --label "$label" --body "$body" > /dev/null
            fi
          elif [ -n "$existing" ]; then
            gh issue close "$existing" -R "$REPOSITORY" --comment "Recovered: $RUN_URL (\`$REF\`)" > /dev/null
          fi

      # The drift check's only output. Plan ran with OIDC env vars, not an az
      # session, so this logs in just to get a token for the ingestion API.
      - name: Azure login for the drift event
        if: always() && inputs.drift && vars.EVENTS_INGESTION_ENDPOINT != '' && vars.EVENTS_DCR_IMMUTABLE_ID != ''
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      # Same shape as container-apps-deploy's deploy event. A plan that never
      # ran (init failed, say) has no has-changes, which is a failed check, not
      # a clean one. A failed post fails the job: a silent gap here would look
      # exactly like a clean night. Changes with the `terraform-pending` issue
      # open are `pending`, not `drifted`; if the issue can't be read (no
      # `issues: read`), they stay `drifted`, so nothing is hidden.
      - name: Record the drift event
        if: always() && inputs.drift && job.status != 'cancelled'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          MARKER: "<!-- terraform-pending:${{ inputs.directory }}:${{ inputs.environment }} -->"
          ENDPOINT: ${{ vars.EVENTS_INGESTION_ENDPOINT }}
          DCR_ID: ${{ vars.EVENTS_DCR_IMMUTABLE_ID }}
          REPOSITORY: ${{ github.repository }}
          TF_ENVIRONMENT: ${{ inputs.environment }}
          DIRECTORY: ${{ inputs.directory }}
          HAS_CHANGES: ${{ steps.plan.outputs.has-changes }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$ENDPOINT" ] || [ -z "$DCR_ID" ]; then
            echo "::notice::EVENTS_INGESTION_ENDPOINT or EVENTS_DCR_IMMUTABLE_ID is not set on this job's environment, so this drift check is not recorded."
            exit 0
          fi

          repo="${REPOSITORY#*/}"
          case "$HAS_CHANGES" in
            false) status=ok detail="No changes." ;;
            true)
              status=drifted
              detail="$(grep -E '^Plan:|^Changes to Outputs:' "$RUNNER_TEMP/plan.txt" | head -1)"
              pending="$(gh issue list -R "$REPOSITORY" --label terraform-pending --state open \
                --json number,body --jq ".[] | select(.body | contains(\"$MARKER\")) | .number" | head -1)" || pending=""
              if [ -n "$pending" ]; then
                status=pending
                detail="$detail Waiting on terraform-pending #$pending."
              fi ;;
            *) status=failed detail="The plan did not complete." ;;
          esac

          row="$(jq -cn \
            --arg time "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg repo "$repo" \
            --arg env "$TF_ENVIRONMENT" \
            --arg name "$repo/$DIRECTORY" \
            --arg status "$status" \
            --arg detail "$detail" \
            --arg run "$RUN_URL" \
            '[{TimeGenerated: $time, Repo: $repo, Environment: $env, Kind: "drift",
               Name: $name, Status: $status, Detail: $detail, RunUrl: $run}]')"
          echo "$row"

          if ! token="$(az account get-access-token --resource https://monitor.azure.com --query accessToken -o tsv)"; then
            echo "::error::No Azure token to record the drift event with (did Azure login succeed?)."
            exit 1
          fi
          code="$(curl -sS -o /tmp/ingest.out -w '%{http_code}' -X POST \
            "${ENDPOINT%/}/dataCollectionRules/${DCR_ID}/streams/Custom-OpsEvents_CL?api-version=2023-01-01" \
            -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
            --data "$row")"
          # 204 is the only success: the API accepts the batch whole or not at all.
          if [ "$code" != "204" ]; then
            echo "::error::Recording the drift event failed with HTTP $code: $(cat /tmp/ingest.out)"
            exit 1
          fi
          echo "Recorded \`$status\` for \`$repo/$DIRECTORY\` in OpsEvents_CL." >> "$GITHUB_STEP_SUMMARY"
