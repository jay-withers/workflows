name: Docker

# Reusable container image CI/CD: builds one or more images from the calling
# repository and optionally pushes them.
#
# One workflow rather than a build one and a publish one, because they are the
# same job with `push` flipped. Keeping them separate meant the pull request
# build and the release build drifted — different contexts, different
# platforms, different cache scopes — so a green PR proved less about the
# release than it appeared to. Here a PR calls this with `push: false` and the
# release calls it with `push: true`, and nothing else differs.
#
# Nothing is tagged `latest` and no tag is ever moved, deliberately. Azure
# Container Apps creates a revision only when the template changes, so
# re-pushing a moving tag deploys nothing and reports success — the one failure
# mode a release pipeline must not have.

on:
  workflow_call:
    inputs:
      images:
        description: >-
          JSON array of objects naming each image to build:
          `[{"name": "api", "context": "apps/api"}]`. `name` is the last
          segment of the image reference and the cache scope; `context` is the
          build context relative to the repository root. One matrix leg each.
        required: true
        type: string
      ref:
        description: >-
          Git ref to check out. Empty checks out the default for the event.
          Set this to the tag being released: on a `workflow_call` `github.sha`
          is the *calling branch's* head, not the tag, so a release that
          trusted it would publish the branch under the tag's name.
        type: string
        default: ""
      push:
        description: >-
          Push the images. Must stay false on a pull request — a fork's
          GITHUB_TOKEN could not push anyway, and a PR that publishes an image
          is a supply-chain hole.
        type: boolean
        default: false
      tags:
        description: >-
          Whitespace- or newline-separated tag values (not full references) to
          apply to every image, e.g. "v1.2.3". Required when pushing.
        type: string
        default: ""
      tag-with-sha:
        description: >-
          Also tag each image with the short SHA of the checked-out commit.
          This is the tag a deploy pins and a run record stores, so it has to
          name the commit that was actually built.
        type: boolean
        default: false
      registry:
        description: Registry host.
        type: string
        default: ghcr.io
      image-prefix:
        description: >-
          Path under the registry that each image name hangs off. Empty uses
          `owner/repo`, which is what GHCR links to this repository.
        type: string
        default: ""
      platforms:
        description: >-
          Buildx target platforms. One platform by default: a manifest list
          with a single entry buys nothing, and a runtime that only ever runs
          amd64 pays for every other architecture in build minutes.
        type: string
        default: linux/amd64
      scan:
        description: >-
          Scan each image with Trivy and upload the findings to the repo's
          Security tab (code scanning). Needs `security-events: write` from
          the caller for the upload; without it the upload only warns.
        type: boolean
        default: true
      scan-fail-on:
        description: >-
          Severities that fail the job when a vulnerability with a fix
          available is found, comma-separated. Only applies to a build that
          does not push (a pull request): a publish reports and never fails,
          so a newly disclosed CVE cannot block deploying unrelated fixes.
          Empty reports only.
        type: string
        default: CRITICAL,HIGH
      summary-note:
        description: >-
          Line appended to the job summary after the pushed references, for
          whatever the reader does next (a deploy command, say). Markdown.
        type: string
        default: ""
      runs-on:
        description: Runner label.
        type: string
        default: ubuntu-latest

jobs:
  build:
    name: Build ${{ matrix.image.name }}
    runs-on: ${{ inputs.runs-on }}
    strategy:
      # Off so every image reports independently: the first broken Dockerfile
      # must not hide whether the others are broken too.
      fail-fast: false
      matrix:
        image: ${{ fromJSON(inputs.images) }}
    # No `permissions` block, for the reason python.yml documents: a called
    # workflow can never hold more than its caller, so pinning `contents: read`
    # here would make `packages: write` unobtainable however the caller is
    # configured, and every push would fail on a permission the caller had
    # actually granted. Callers must set their own — the README's examples do.
    steps:
      # This workflow builds whatever code it checks out. On `pull_request`
      # that is the point (CI building the PR), and that event carries no
      # secrets. Under `pull_request_target` the same build would run a
      # stranger's code with the base repository's secrets and a write token,
      # so that event is refused outright rather than trusted to every caller.
      - name: Refuse pull_request_target
        if: github.event_name == 'pull_request_target'
        run: |
          echo "::error::docker.yml must not run on pull_request_target: it builds the checked-out code."
          exit 1

      - name: Checkout ${{ inputs.ref }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      # Resolved here rather than interpolated into `tags:` directly, so the
      # inputs reach the shell through the environment and a tag value cannot
      # execute anything.
      - name: Resolve image references
        id: refs
        env:
          REGISTRY: ${{ inputs.registry }}
          IMAGE_PREFIX: ${{ inputs.image-prefix }}
          REPOSITORY: ${{ github.repository }}
          NAME: ${{ matrix.image.name }}
          TAGS: ${{ inputs.tags }}
          TAG_WITH_SHA: ${{ inputs.tag-with-sha }}
          PUSH: ${{ inputs.push }}
        run: |
          prefix="${IMAGE_PREFIX:-$REPOSITORY}"
          image="$REGISTRY/$prefix/$NAME"

          # Split on any whitespace, so a caller can pass one tag, a
          # space-separated pair, or a YAML block scalar per line. Read from a
          # stream rather than left unquoted, which would be exactly the word
          # splitting SC2086 is right to flag.
          #
          # The '\n' in the printf is load-bearing. `read` returns non-zero on
          # a final line with no trailing newline, and the loop body does not
          # run for it — so `printf '%s'` silently dropped a single-tag input
          # entirely, and published only the SHA tag.
          values=()
          while read -r tag; do
            [ -n "$tag" ] || continue
            values+=("$tag")
          done < <(printf '%s\n' "$TAGS" | tr -s '[:space:]' '\n')

          # Guards the above rather than only the empty-input case. The
          # original bug published a usable image under one tag and lost the
          # other, so "push succeeded" was not evidence the tags were right:
          # a non-empty `tags` input that yields no values is now an error,
          # whatever tag-with-sha may have added.
          if [ -n "${TAGS//[[:space:]]/}" ] && [ ${#values[@]} -eq 0 ]; then
            echo "::error::tags was non-empty but no tag values parsed out of it: '$TAGS'"
            exit 1
          fi
          if [ "$TAG_WITH_SHA" = "true" ]; then
            values+=("$(git rev-parse --short HEAD)")
          fi

          # A push with no tags would succeed at the build and silently
          # publish nothing usable, so fail here instead. A build that is not
          # pushing needs no tag at all.
          if [ "$PUSH" = "true" ] && [ ${#values[@]} -eq 0 ]; then
            echo "::error::push is true but no tags were resolved — pass tags and/or tag-with-sha."
            exit 1
          fi

          {
            echo "tags<<EOF"
            for value in "${values[@]}"; do
              echo "$image:$value"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ${{ inputs.registry }}
        if: inputs.push
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The cache is keyed by image name and shared between a pushing and a
      # non-pushing call, so a release usually reuses the layers its pull
      # request already built.
      #
      # Two GHCR things `packages: write` cannot supply, for a first push:
      # a new package is private whatever the repository's visibility, so it
      # has to be made public once if anything pulls anonymously; and
      # GITHUB_TOKEN can only write to a package *linked* to this repository.
      # A package first pushed by hand is user-scoped and unlinked, and this
      # step then fails `denied: permission_denied: write_package`, which reads
      # like a missing permission rather than a missing link. The
      # `org.opencontainers.image.source` label establishes the link, but only
      # from a push that is already allowed — so either push once by hand with
      # the label in place, or grant the repository Write under the package's
      # "Manage Actions access".
      - name: Build ${{ matrix.image.name }} for ${{ inputs.platforms }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image.context }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          # A pull request build is loaded into the local daemon under a
          # local-only tag so Trivy can scan it; a pushed build is scanned
          # from the registry instead. Loading needs a single platform.
          load: ${{ !inputs.push && inputs.scan && !contains(inputs.platforms, ',') }}
          # The local tag only on a build that does not push: pushed, it would
          # go to Docker Hub.
          tags: |
            ${{ steps.refs.outputs.tags }}
            ${{ !inputs.push && format('local-scan/{0}:{1}', matrix.image.name, github.run_id) || '' }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

      # Trivy, on every build. Findings of every severity go to the Security
      # tab, where repo-agent's weekly digest reads them. A pull request also
      # fails on `scan-fail-on` severities that have a fix available: that is
      # the one kind of finding a PR can act on (bump the base or the package),
      # and it stops Renovate auto-merging an image that ships one. Unfixed
      # findings never block; nothing in a PR can fix them. A publish never
      # fails on a finding, since the image is already pushed and failing
      # would only skip the deploy of whatever else that release carries.
      # Accepted risks go in a `.trivyignore` at the repo root.
      #
      # Deliberately unpinned Trivy version, as in dev-containers' cd-scan: a
      # scanner is only as good as its newest detection logic.
      - name: Install Trivy
        if: inputs.scan && (inputs.push || !contains(inputs.platforms, ','))
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: latest

      - name: Scan ${{ matrix.image.name }}
        id: scan
        if: inputs.scan && (inputs.push || !contains(inputs.platforms, ','))
        env:
          PUSH: ${{ inputs.push }}
          NAME: ${{ matrix.image.name }}
          LOCAL_REF: local-scan/${{ matrix.image.name }}:${{ github.run_id }}
          REFS: ${{ steps.refs.outputs.tags }}
          FAIL_ON: ${{ inputs.scan-fail-on }}
        run: |
          if [ "$PUSH" = "true" ]; then
            ref="$(printf '%s\n' "$REFS" | head -1)"
          else
            ref="$LOCAL_REF"
          fi
          echo "Scanning $ref"
          ignore=()
          if [ -f .trivyignore ]; then ignore=(--ignorefile .trivyignore); fi

          # Everything, for the Security tab.
          trivy image --quiet "${ignore[@]}" --format sarif \
            --output "$RUNNER_TEMP/trivy-$NAME.sarif" "$ref"
          echo "sarif=$RUNNER_TEMP/trivy-$NAME.sarif" >> "$GITHUB_OUTPUT"

          # The gate: fixable findings at the failing severities. Printed as a
          # table either way, so the log says what was found.
          gate=0
          if [ "$PUSH" != "true" ] && [ -n "$FAIL_ON" ]; then
            trivy image --quiet --skip-db-update "${ignore[@]}" --ignore-unfixed \
              --severity "$FAIL_ON" --exit-code 1 --format table "$ref" || gate=$?
          else
            trivy image --quiet --skip-db-update "${ignore[@]}" --ignore-unfixed \
              --severity CRITICAL,HIGH --format table "$ref"
          fi
          echo "gate=$gate" >> "$GITHUB_OUTPUT"

      - name: Upload ${{ matrix.image.name }} findings to code scanning
        if: always() && steps.scan.outputs.sarif != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: trivy-${{ matrix.image.name }}

      # Last, so the findings are uploaded before the job fails on them.
      - name: Refuse fixable ${{ inputs.scan-fail-on }} vulnerabilities
        if: steps.scan.outputs.gate != '' && steps.scan.outputs.gate != '0'
        env:
          NAME: ${{ matrix.image.name }}
          FAIL_ON: ${{ inputs.scan-fail-on }}
        run: |
          echo "::error::$NAME has $FAIL_ON vulnerabilities with a fix available (table above). Update the base image or the package, or accept the risk in .trivyignore."
          exit 1

      - name: Summarise
        if: inputs.push
        env:
          NAME: ${{ matrix.image.name }}
          REFS: ${{ steps.refs.outputs.tags }}
          NOTE: ${{ inputs.summary-note }}
        run: |
          {
            echo "### $NAME"
            echo
            echo '```'
            echo "$REFS"
            echo '```'
            if [ -n "$NOTE" ]; then
              echo
              echo "$NOTE"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
