name: Docker

# Reusable container image CI/CD: builds one or more images from the calling
# repository and optionally pushes them.
#
# One workflow rather than a build one and a publish one, because they are the
# same job with `push` flipped. Keeping them separate meant the pull request
# build and the release build drifted — different contexts, different
# platforms, different cache scopes — so a green PR proved less about the
# release than it appeared to. Here a PR calls this with `push: false` and the
# release calls it with `push: true`, and nothing else differs.
#
# Nothing is tagged `latest` and no tag is ever moved, deliberately. Azure
# Container Apps creates a revision only when the template changes, so
# re-pushing a moving tag deploys nothing and reports success — the one failure
# mode a release pipeline must not have.

on:
  workflow_call:
    inputs:
      images:
        description: >-
          JSON array of objects naming each image to build:
          `[{"name": "api", "context": "apps/api"}]`. `name` is the last
          segment of the image reference and the cache scope; `context` is the
          build context relative to the repository root. One matrix leg each.
          (v1.35.0+) An optional `python`, the command that runs the image's
          interpreter (`"python"`, `"python3"`), checks on a build that does
          not push that its major.minor matches the `python` pin in the
          repository root's mise.toml, which local runs and CI test on.
          (v1.36.0+) An optional `node`, the command that runs the image's
          Node (`"node"`), does the same for its major version against the
          `node` pin in the nearest mise config from `context` up to the root.
        required: true
        type: string
      ref:
        description: >-
          Git ref to check out. Empty checks out the default for the event.
          Set this to the tag being released: on a `workflow_call` `github.sha`
          is the *calling branch's* head, not the tag, so a release that
          trusted it would publish the branch under the tag's name.
        type: string
        default: ""
      push:
        description: >-
          Push the images. Must stay false on a pull request — a fork's
          GITHUB_TOKEN could not push anyway, and a PR that publishes an image
          is a supply-chain hole.
        type: boolean
        default: false
      tags:
        description: >-
          Whitespace- or newline-separated tag values (not full references) to
          apply to every image, e.g. "v1.2.3". Required when pushing.
        type: string
        default: ""
      tag-with-sha:
        description: >-
          Also tag each image with the short SHA of the checked-out commit.
          This is the tag a deploy pins and a run record stores, so it has to
          name the commit that was actually built.
        type: boolean
        default: false
      registry:
        description: Registry host.
        type: string
        default: ghcr.io
      image-prefix:
        description: >-
          Path under the registry that each image name hangs off. Empty uses
          `owner/repo`, which is what GHCR links to this repository.
        type: string
        default: ""
      platforms:
        description: >-
          Buildx target platforms. One platform by default: a manifest list
          with a single entry buys nothing, and a runtime that only ever runs
          amd64 pays for every other architecture in build minutes.
        type: string
        default: linux/amd64
      scan:
        description: >-
          Scan each image with Trivy and upload the findings to the repo's
          Security tab (code scanning). Needs `security-events: write` from
          the caller for the upload; without it the upload only warns.
        type: boolean
        default: true
      scan-fail-on:
        description: >-
          Severities that fail the job when a vulnerability with a fix
          available is found, comma-separated. Only applies to a build that
          does not push (a pull request): a publish reports and never fails,
          so a newly disclosed CVE cannot block deploying unrelated fixes.
          Empty reports only.
        type: string
        default: CRITICAL,HIGH
      attest:
        description: >-
          On a push, attest each image's build provenance and its SBOM (from
          Trivy, so only with `scan`) to GitHub's attestation store and the
          registry, so a deploy can prove the image came from this workflow
          and this repository (`gh attestation verify`, or
          container-apps-deploy.yml's `verify-images`). Needs `id-token: write`
          and `attestations: write` from the caller, beside `packages: write`.
          Without `id-token: write` it skips with a warning.
        type: boolean
        default: true
      summary-note:
        description: >-
          Line appended to the job summary after the pushed references, for
          whatever the reader does next (a deploy command, say). Markdown.
        type: string
        default: ""
      failure-issue:
        description: >-
          Open a `build-failed` issue when a build fails (the Trivy gate
          included), comment on it while it keeps failing, and close it on the
          next success. For a scheduled build of main; ignored on a pull
          request. Needs `issues: write` from the caller.
        type: boolean
        default: false
      runs-on:
        description: Runner label.
        type: string
        default: ubuntu-latest

jobs:
  build:
    name: Build ${{ matrix.image.name }}
    runs-on: ${{ inputs.runs-on }}
    strategy:
      # Off so every image reports independently: the first broken Dockerfile
      # must not hide whether the others are broken too.
      fail-fast: false
      matrix:
        image: ${{ fromJSON(inputs.images) }}
    # No `permissions` block, for the reason python.yml documents: a called
    # workflow can never hold more than its caller, so pinning `contents: read`
    # here would make `packages: write` unobtainable however the caller is
    # configured, and every push would fail on a permission the caller had
    # actually granted. Callers must set their own — the README's examples do.
    steps:
      # This workflow builds whatever code it checks out. On `pull_request`
      # that is the point (CI building the PR), and that event carries no
      # secrets. Under `pull_request_target` the same build would run a
      # stranger's code with the base repository's secrets and a write token,
      # so that event is refused outright rather than trusted to every caller.
      - name: Refuse pull_request_target
        if: github.event_name == 'pull_request_target'
        run: |
          echo "::error::docker.yml must not run on pull_request_target: it builds the checked-out code."
          exit 1

      - name: Checkout ${{ inputs.ref }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      # Resolved here rather than interpolated into `tags:` directly, so the
      # inputs reach the shell through the environment and a tag value cannot
      # execute anything.
      - name: Resolve image references
        id: refs
        env:
          REGISTRY: ${{ inputs.registry }}
          IMAGE_PREFIX: ${{ inputs.image-prefix }}
          REPOSITORY: ${{ github.repository }}
          NAME: ${{ matrix.image.name }}
          TAGS: ${{ inputs.tags }}
          TAG_WITH_SHA: ${{ inputs.tag-with-sha }}
          PUSH: ${{ inputs.push }}
        run: |
          prefix="${IMAGE_PREFIX:-$REPOSITORY}"
          image="$REGISTRY/$prefix/$NAME"

          # Split on any whitespace, so a caller can pass one tag, a
          # space-separated pair, or a YAML block scalar per line. Read from a
          # stream rather than left unquoted, which would be exactly the word
          # splitting SC2086 is right to flag.
          #
          # The '\n' in the printf is load-bearing. `read` returns non-zero on
          # a final line with no trailing newline, and the loop body does not
          # run for it — so `printf '%s'` silently dropped a single-tag input
          # entirely, and published only the SHA tag.
          values=()
          while read -r tag; do
            [ -n "$tag" ] || continue
            values+=("$tag")
          done < <(printf '%s\n' "$TAGS" | tr -s '[:space:]' '\n')

          # Guards the above rather than only the empty-input case. The
          # original bug published a usable image under one tag and lost the
          # other, so "push succeeded" was not evidence the tags were right:
          # a non-empty `tags` input that yields no values is now an error,
          # whatever tag-with-sha may have added.
          if [ -n "${TAGS//[[:space:]]/}" ] && [ ${#values[@]} -eq 0 ]; then
            echo "::error::tags was non-empty but no tag values parsed out of it: '$TAGS'"
            exit 1
          fi
          if [ "$TAG_WITH_SHA" = "true" ]; then
            values+=("$(git rev-parse --short HEAD)")
          fi

          # A push with no tags would succeed at the build and silently
          # publish nothing usable, so fail here instead. A build that is not
          # pushing needs no tag at all.
          if [ "$PUSH" = "true" ] && [ ${#values[@]} -eq 0 ]; then
            echo "::error::push is true but no tags were resolved — pass tags and/or tag-with-sha."
            exit 1
          fi

          echo "image=$image" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            for value in "${values[@]}"; do
              echo "$image:$value"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ${{ inputs.registry }}
        if: inputs.push
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The cache is keyed by image name and shared between a pushing and a
      # non-pushing call, so a release usually reuses the layers its pull
      # request already built.
      #
      # Two GHCR things `packages: write` cannot supply, for a first push:
      # a new package is private whatever the repository's visibility, so it
      # has to be made public once if anything pulls anonymously; and
      # GITHUB_TOKEN can only write to a package *linked* to this repository.
      # A package first pushed by hand is user-scoped and unlinked, and this
      # step then fails `denied: permission_denied: write_package`, which reads
      # like a missing permission rather than a missing link. The
      # `org.opencontainers.image.source` label establishes the link, but only
      # from a push that is already allowed — so either push once by hand with
      # the label in place, or grant the repository Write under the package's
      # "Manage Actions access".
      - name: Resolve OS_PATCH_DATE
        id: patch-date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.image.name }} for ${{ inputs.platforms }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image.context }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          # A pull request build is loaded into the local daemon under a
          # local-only tag so Trivy can scan it; a pushed build is scanned
          # from the registry instead. Loading needs a single platform.
          # The Python and Node checks (below) run the loaded image too.
          load: ${{ !inputs.push && (inputs.scan || matrix.image.python != '' || matrix.image.node != '') && !contains(inputs.platforms, ',') }}
          # The local tag only on a build that does not push: pushed, it would
          # go to Docker Hub.
          tags: |
            ${{ steps.refs.outputs.tags }}
            ${{ !inputs.push && format('local-scan/{0}:{1}', matrix.image.name, github.run_id) || '' }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
          # The layer cache is keyed by instruction, so a Dockerfile's
          # `apt-get upgrade`/`apk upgrade` step is reused until its line or the
          # base digest changes, and security fixes published since then never
          # reach the image: Trivy then fails the build on a "fixable"
          # vulnerability the upgrade step was written to fix. A build arg
          # invalidates the cache from where a Dockerfile declares it, so one
          # that changes daily re-runs only what follows `ARG OS_PATCH_DATE`
          # (put it just before the upgrade step) once a day, and leaves
          # everything above it cached. A Dockerfile without the ARG ignores it.
          build-args: |
            OS_PATCH_DATE=${{ steps.patch-date.outputs.date }}

      # Trivy, on every build. Findings of every severity go to the Security
      # tab, where repo-agent's weekly digest reads them. A pull request also
      # fails on `scan-fail-on` severities that have a fix available: that is
      # the one kind of finding a PR can act on (bump the base or the package),
      # and it stops Renovate auto-merging an image that ships one. Unfixed
      # findings never block; nothing in a PR can fix them. A publish never
      # fails on a finding, since the image is already pushed and failing
      # would only skip the deploy of whatever else that release carries.
      # Accepted risks go in a `.trivyignore` at the repo root.
      #
      # Deliberately unpinned Trivy version, as in dev-containers' cd-scan: a
      # scanner is only as good as its newest detection logic.
      - name: Install Trivy
        if: inputs.scan && (inputs.push || !contains(inputs.platforms, ','))
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: latest

      - name: Scan ${{ matrix.image.name }}
        id: scan
        if: inputs.scan && (inputs.push || !contains(inputs.platforms, ','))
        env:
          PUSH: ${{ inputs.push }}
          NAME: ${{ matrix.image.name }}
          LOCAL_REF: local-scan/${{ matrix.image.name }}:${{ github.run_id }}
          REFS: ${{ steps.refs.outputs.tags }}
          FAIL_ON: ${{ inputs.scan-fail-on }}
        run: |
          if [ "$PUSH" = "true" ]; then
            ref="$(printf '%s\n' "$REFS" | head -1)"
          else
            ref="$LOCAL_REF"
          fi
          echo "Scanning $ref"
          ignore=()
          if [ -f .trivyignore ]; then ignore=(--ignorefile .trivyignore); fi

          # Everything, for the Security tab.
          trivy image --quiet "${ignore[@]}" --format sarif \
            --output "$RUNNER_TEMP/trivy-$NAME.sarif" "$ref"
          echo "sarif=$RUNNER_TEMP/trivy-$NAME.sarif" >> "$GITHUB_OUTPUT"

          # The gate: fixable findings at the failing severities. Printed as a
          # table either way, so the log says what was found.
          gate=0
          if [ "$PUSH" != "true" ] && [ -n "$FAIL_ON" ]; then
            trivy image --quiet --skip-db-update "${ignore[@]}" --ignore-unfixed \
              --severity "$FAIL_ON" --exit-code 1 --format table "$ref" || gate=$?
          else
            trivy image --quiet --skip-db-update "${ignore[@]}" --ignore-unfixed \
              --severity CRITICAL,HIGH --format table "$ref"
          fi
          echo "gate=$gate" >> "$GITHUB_OUTPUT"

      - name: Upload ${{ matrix.image.name }} findings to code scanning
        if: always() && steps.scan.outputs.sarif != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: trivy-${{ matrix.image.name }}

      # Provenance: a signed statement that this digest was built by this
      # workflow, from this repository at this commit, which a deploy can check
      # before rolling the tag out. A tag can be re-pointed by anyone holding a
      # package write token; a signature over the digest can't be forged.
      #
      # Signed with GitHub's OIDC token, so a caller that hasn't granted
      # `id-token: write` would fail here, after the push. That is checked
      # first and skipped with a warning instead, so the image still ships.
      # actions/attest-* rather than raising buildx's own `provenance`/`sbom`
      # (it already adds min-mode provenance by default): buildx's are
      # unsigned, while these are signed by this workflow's identity, which
      # `gh attestation verify --signer-workflow` can pin.
      - name: Check attestation permissions
        id: attest
        if: inputs.push && inputs.attest
        run: |
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::attest is on but the caller didn't grant id-token: write (and attestations: write), so this image has no provenance and a deploy that verifies it will refuse it."
          fi

      - name: Attest ${{ matrix.image.name }} build provenance
        if: steps.attest.outputs.enabled == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.refs.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # The SBOM comes from the Trivy that's already installed, scanning the
      # pushed digest rather than a tag, so it describes exactly what was
      # attested above.
      - name: Generate ${{ matrix.image.name }} SBOM
        id: sbom
        if: steps.attest.outputs.enabled == 'true' && inputs.scan
        env:
          NAME: ${{ matrix.image.name }}
          REF: ${{ steps.refs.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          trivy image --quiet --skip-db-update --format cyclonedx \
            --output "$RUNNER_TEMP/sbom-$NAME.cdx.json" "$REF"
          echo "path=$RUNNER_TEMP/sbom-$NAME.cdx.json" >> "$GITHUB_OUTPUT"

      - name: Attest ${{ matrix.image.name }} SBOM
        if: steps.sbom.outputs.path != ''
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.refs.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: ${{ steps.sbom.outputs.path }}
          push-to-registry: true

      # Last, so the findings are uploaded before the job fails on them.
      # The image's own interpreter against the one mise.toml pins, which is
      # what local test runs and python.yml's suite run on. They are pinned in
      # two places (the image's base, often another repository's, and
      # mise.toml) and nothing else compares them, so a pass in CI could
      # otherwise say nothing about the interpreter that ships. Major.minor
      # only: a patch release changes no behaviour a suite would see. On a
      # build that does not push, which is every pull request and the daily
      # build of main, so drift on either side fails a PR or opens the
      # build-failed issue. After the scan and its upload, so a mismatch
      # never hides the image's findings.
      - name: Check ${{ matrix.image.name }}'s Python matches mise.toml
        if: ${{ !cancelled() && steps.build.outcome == 'success' && !inputs.push && matrix.image.python != '' && !contains(inputs.platforms, ',') }}
        env:
          PYTHON_COMMAND: ${{ matrix.image.python }}
          LOCAL_REF: local-scan/${{ matrix.image.name }}:${{ github.run_id }}
          NAME: ${{ matrix.image.name }}
        run: |
          config=""
          for candidate in mise.toml .mise.toml; do
            if [ -f "$candidate" ]; then config="$candidate"; break; fi
          done
          if [ -z "$config" ]; then
            echo "::error::$NAME sets python, but the repository has no mise.toml at its root to compare with."
            exit 1
          fi
          # tomllib, not a regex: mise takes `python = "3.15.2"`, a list
          # (`["3.15"]`, the first is the default) or a table with `version`,
          # and only [tools] counts.
          pinned="$(python3 - "$config" <<'PY'
          import re, sys, tomllib
          tool = tomllib.load(open(sys.argv[1], "rb")).get("tools", {}).get("python")
          if isinstance(tool, list):
              tool = tool[0] if tool else None
          if isinstance(tool, dict):
              tool = tool.get("version")
          match = re.match(r"(\d+)\.(\d+)", str(tool or ""))
          print(f"{match[1]}.{match[2]}" if match else "")
          PY
          )"
          if [ -z "$pinned" ]; then
            echo "::error::$NAME sets python, but $config pins no python X.Y[.Z] under [tools]."
            exit 1
          fi
          image="$(docker run --rm --entrypoint "$PYTHON_COMMAND" "$LOCAL_REF" \
            -c 'import sys; print("%d.%d" % sys.version_info[:2])')" || {
            echo "::error::Could not run '$PYTHON_COMMAND' in $NAME's image. Set python to the command that starts its interpreter."
            exit 1
          }
          if [ "$image" != "$pinned" ]; then
            echo "::error::$NAME's image runs Python $image, but $config pins $pinned, which local runs and CI test on. Move them together: the base image's Python and $config's python."
            exit 1
          fi
          echo "$NAME's image runs Python $image, as $config pins."

      # The Node counterpart of the Python check above, for what node.yml's
      # suite runs on. Major only: Node's release lines are its majors, and a
      # minor within one changes nothing a suite would see. mise.toml must pin
      # a number; an alias such as "lts" names no one version to compare.
      #
      # The pin is the one mise would use in the image's build context: the
      # nearest mise.toml or .mise.toml from the context up to the repository
      # root that pins node. That is the config node.yml's suite runs on when
      # its working-directory is the context, so a package in a subdirectory
      # with its own pin (as tests/node has) is compared with that pin, not
      # the root's.
      - name: Check ${{ matrix.image.name }}'s Node matches mise.toml
        if: ${{ !cancelled() && steps.build.outcome == 'success' && !inputs.push && matrix.image.node != '' && !contains(inputs.platforms, ',') }}
        env:
          NODE_COMMAND: ${{ matrix.image.node }}
          LOCAL_REF: local-scan/${{ matrix.image.name }}:${{ github.run_id }}
          NAME: ${{ matrix.image.name }}
          CONTEXT: ${{ matrix.image.context }}
        run: |
          # tomllib, as for Python: a string, a list (the first is the
          # default) or a table with `version`, and only [tools] counts.
          # Prints "<config>\t<major>", "<config>\t" for a pin that is not a
          # number, or nothing when no config pins node.
          found="$(python3 - "${CONTEXT:-.}" <<'PY'
          import os, re, sys, tomllib
          root = os.path.realpath(".")
          here = os.path.realpath(sys.argv[1])
          if os.path.commonpath([root, here]) != root:
              here = root
          while True:
              for name in ("mise.toml", ".mise.toml"):
                  path = os.path.join(here, name)
                  if not os.path.isfile(path):
                      continue
                  tool = tomllib.load(open(path, "rb")).get("tools", {}).get("node")
                  if tool is None:
                      continue
                  if isinstance(tool, list):
                      tool = tool[0] if tool else None
                  if isinstance(tool, dict):
                      tool = tool.get("version")
                  match = re.match(r"v?(\d+)(\.|$)", str(tool or ""))
                  print(f"{os.path.relpath(path, root)}\t{match[1] if match else ''}")
                  sys.exit(0)
              if here == root:
                  break
              here = os.path.dirname(here)
          PY
          )"
          if [ -z "$found" ]; then
            echo "::error::$NAME sets node, but no mise.toml from its context (${CONTEXT:-.}) up to the repository root pins node."
            exit 1
          fi
          config="${found%%$'\t'*}"
          pinned="${found#*$'\t'}"
          if [ -z "$pinned" ]; then
            echo "::error::$NAME sets node, but $config pins no node X[.Y.Z] under [tools]."
            exit 1
          fi
          image="$(docker run --rm --entrypoint "$NODE_COMMAND" "$LOCAL_REF" \
            -p 'process.versions.node.split(".")[0]')" || {
            echo "::error::Could not run '$NODE_COMMAND' in $NAME's image. Set node to the command that starts it."
            exit 1
          }
          if [ "$image" != "$pinned" ]; then
            echo "::error::$NAME's image runs Node $image, but $config pins $pinned, which local runs and CI test on. Move them together: the base image's Node and $config's node."
            exit 1
          fi
          echo "$NAME's image runs Node $image, as $config pins."

      # Not run on a multi-platform build, which is never loaded into the
      # daemon; said so rather than skipped silently.
      - name: Note the skipped Python check
        if: ${{ !inputs.push && matrix.image.python != '' && contains(inputs.platforms, ',') }}
        env:
          NAME: ${{ matrix.image.name }}
        run: echo "::warning::$NAME sets python, but a multi-platform build is not loaded to run it, so its Python was not compared with mise.toml. Build one platform on pull requests to check it."

      - name: Note the skipped Node check
        if: ${{ !inputs.push && matrix.image.node != '' && contains(inputs.platforms, ',') }}
        env:
          NAME: ${{ matrix.image.name }}
        run: echo "::warning::$NAME sets node, but a multi-platform build is not loaded to run it, so its Node was not compared with mise.toml. Build one platform on pull requests to check it."

      - name: Refuse fixable ${{ inputs.scan-fail-on }} vulnerabilities
        if: steps.scan.outputs.gate != '' && steps.scan.outputs.gate != '0'
        env:
          NAME: ${{ matrix.image.name }}
          FAIL_ON: ${{ inputs.scan-fail-on }}
        run: |
          echo "::error::$NAME has $FAIL_ON vulnerabilities with a fix available (table above). Update the base image or the package, or accept the risk in .trivyignore."
          exit 1

      - name: Summarise
        if: inputs.push
        env:
          NAME: ${{ matrix.image.name }}
          REFS: ${{ steps.refs.outputs.tags }}
          NOTE: ${{ inputs.summary-note }}
        run: |
          {
            echo "### $NAME"
            echo
            echo '```'
            echo "$REFS"
            echo '```'
            if [ -n "$NOTE" ]; then
              echo
              echo "$NOTE"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # A scheduled build of main reports through an issue, because nothing else
  # would. The gate fails on a fixable CVE published after the last merge,
  # and nothing has changed on main to trigger a build, so the first anyone
  # heard was a Renovate PR failing container-build for a reason that had
  # nothing to do with it. Every other PR then failed the same way, and
  # repo-agent's weekly digest named them 11-13 days later (security-testing's
  # pyasn1, November 2026). A daily build with this on gets an email the day
  # the fix is available. Same shape as container-apps-deploy.yml's
  # deploy-failed issue: one open issue per repository, found by a hidden
  # marker, a comment per repeat failure, and closed by the next success.
  # Needs `issues: write`; without it this warns and the result stands.
  report:
    name: Report
    needs: build
    if: >-
      always() && inputs.failure-issue
      && github.event_name != 'pull_request'
      && needs.build.result != 'cancelled' && needs.build.result != 'skipped'
    runs-on: ${{ inputs.runs-on }}
    continue-on-error: true
    steps:
      - name: Report the outcome as an issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          OUTCOME: ${{ needs.build.result }}
          REF: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MARKER: "<!-- build-failed:docker.yml -->"
        run: |
          label=build-failed
          if ! existing="$(gh issue list -R "$REPOSITORY" --label "$label" --state open \
            --json number,body --jq ".[] | select(.body | contains(\"$MARKER\")) | .number" 2>&1 | head -1)"; then
            echo "::warning::Could not read issues (grant issues: write): $existing"
            exit 0
          fi
          if [ "$OUTCOME" = "failure" ]; then
            gh label create "$label" -R "$REPOSITORY" --color B60205 \
              --description "The image no longer builds, passes Trivy, or matches mise.toml's Python or Node on main. Closed by the next success." 2>/dev/null || true
            if [ -n "$existing" ]; then
              gh issue comment "$existing" -R "$REPOSITORY" --body "Failed again: $RUN_URL" > /dev/null
            else
              body="$(printf '%s\n%s\n\n%s\n\n%s\n' "$MARKER" \
                "@$OWNER The image build on \`$REF\` failed: it no longer builds, Trivy found a fixable CRITICAL/HIGH vulnerability, or its Python or Node no longer matches mise.toml's (the log names which). Every pull request's \`container-build\` check fails the same way until it is fixed, so Renovate's PRs stop merging." \
                "Run: $RUN_URL" \
                "Fix it on main (bump the base image or package, accept the risk in \`.trivyignore\`, or move the base image's Python or Node and mise.toml's pin together). This issue closes itself on the next successful build.")"
              gh issue create -R "$REPOSITORY" --title "Image build on $REF failed" --label "$label" --body "$body" > /dev/null
            fi
          elif [ -n "$existing" ]; then
            gh issue close "$existing" -R "$REPOSITORY" --comment "Recovered: $RUN_URL" > /dev/null
          fi
