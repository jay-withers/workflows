# Internal: this repo's own use of the reusable pre-commit.yml and go.yml
# workflows. Not part of the public API — other repos should call them directly.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pre-commit:
    uses: ./.github/workflows/pre-commit.yml

  # A self-test of go.yml against the sample module in tests/go, so a change
  # to go.yml runs before any caller's pin moves. Every gate is on except the
  # PR comment, which would need pull-requests: write on this repo. The
  # diff-coverage path mapping only meets real lines on a PR that changes
  # tests/go/calc; touch it there when changing how coverage is converted.
  # Not a required check: it only ever proves go.yml works.
  go:
    uses: ./.github/workflows/go.yml
    with:
      working-directory: tests/go
      coverage: true
      coverage-min: "90"
      diff-coverage: "90"

  # The same self-test for dotnet.yml, against the sample solution in
  # tests/dotnet, with every gate on but the PR comment. Touch
  # tests/dotnet/src/Calc when changing how coverage is merged or diffed, so
  # the diff-coverage gate meets real lines. Not a required check.
  dotnet:
    uses: ./.github/workflows/dotnet.yml
    with:
      working-directory: tests/dotnet
      coverage: true
      coverage-min: "90"
      diff-coverage: "90"
